    }
    fg += `<g id="grass" fill="none" stroke="#3f6b3c" stroke-linecap="round">`;
    GRASS_BUCKETS.forEach(b => { fg += `<g class="grassH" data-h="${b}">${buckets[b]}</g>`; });
    fg += `</g>`;

    // ── Small measuring stake in the grass (MINI_PX_PER_INCH) ──
    const mTop = m.yForDepth(D);
    fg += `<rect x="${m.x - 2}" y="${mTop - 3}" width="4" height="${m.baseY - mTop + 5}" fill="#8a5a3a" stroke="#5e3c26" stroke-width="0.6"/>`;
    for (let inch = 0; inch <= D; inch++) {
      const y = m.yForDepth(inch).toFixed(2), major = inch % SM.LABEL_EVERY === 0 || inch === D;
      fg += `<line class="mini-mark" data-inch="${inch}" x1="${m.x - (major ? 4.5 : 3)}" x2="${m.x + 2}" y1="${y}" y2="${y}" stroke="#ffffff" stroke-width="${major ? 1 : 0.6}" opacity="0.85"/>`;
    }
    fg += `<rect id="miniSnow" x="${m.x - 9}" y="${m.baseY}" width="18" height="0" rx="2" fill="url(#snowG)" style="display:none"/>`;

    // ── Bird feeder on a pole, in the grass on the right ──
    const fBase = fgTop + (h - fgTop) * 0.78, fx = Math.max(w * 0.88, m.x + 40), poleTop = fgTop - h * 0.05;
    const pw = Math.max(2.5, S * 0.008), tw = S * 0.12;
    fg += `<rect x="${fx - pw / 2}" y="${poleTop}" width="${pw}" height="${fBase - poleTop}" fill="#3d4352"/>
      <rect x="${fx - pw / 2}" y="${poleTop}" width="${pw * 0.35}" height="${fBase - poleTop}" fill="#596075"/>
      <rect x="${fx - tw / 2}" y="${poleTop - 4}" width="${tw}" height="5" rx="1.5" fill="#7a5638"/>
      <rect x="${fx - tw * 0.32}" y="${poleTop - tw * 0.42}" width="${tw * 0.64}" height="${tw * 0.38}" fill="#a57a50" stroke="#6b4a2f" stroke-width="1"/>
      <rect x="${fx - tw * 0.14}" y="${poleTop - tw * 0.3}" width="${tw * 0.28}" height="${tw * 0.18}" fill="#3a2a1d"/>
      <polygon points="${fx - tw * 0.45},${poleTop - tw * 0.4} ${fx},${poleTop - tw * 0.72} ${fx + tw * 0.45},${poleTop - tw * 0.4}" fill="#8a3b32" stroke="#5d2722" stroke-width="1"/>`;
    for (let i = 0; i < 6; i++) fg += `<circle cx="${(fx + R(-tw * 0.45, tw * 0.45)).toFixed(1)}" cy="${(poleTop - 4.5).toFixed(1)}" r="1" fill="#d9b26a"/>`;

    // ── Zoom callout: the inset is a close-up of the small stake ──
    const cue = `<g opacity="0.55" stroke="#ffffff" fill="none">
      <rect x="${m.x - 9}" y="${mTop - 6}" width="18" height="${m.baseY - mTop + 10}" rx="3" stroke-width="1"/>
      <line x1="${I.x + I.w - 2}" y1="${I.y + 2}" x2="${m.x - 9}" y2="${mTop - 6}" stroke-width="0.9" stroke-dasharray="3 3"/>
      <line x1="${I.x + I.w - 2}" y1="${insetBottom - 2}" x2="${m.x - 9}" y2="${m.baseY + 4}" stroke-width="0.9" stroke-dasharray="3 3"/></g>`;

    // ── The measuring inset: the cutaway, close up (Section 1b) ──
    // Flat snow layer, soil strip, a little grass, and the big stake (one
    // inch = PX_PER_INCH). The Match overlay sits inside it.
    let ins = `<g id="inset" clip-path="url(#insetClip)">
      <rect x="${I.x}" y="${I.y}" width="${I.w}" height="${I.groundY - I.y + 1}" fill="url(#insetG)"/>`;
    const insetBuckets = {};
    GRASS_BUCKETS.forEach(b => { insetBuckets[b] = ''; });
    for (let i = 0; i < 16; i++) {
      const inches = GRASS_BUCKETS[Math.floor(rng() * GRASS_BUCKETS.length)];
      const x = I.x + R(4, I.w - 4), hPx = inches * px;
      let d = '';
      for (let bl = 0; bl < 4; bl++) {
        const lean = (rng() - 0.5) * hPx * 0.45, hh = hPx * (0.75 + rng() * 0.25);
        d += `M${(x + (bl - 1.5) * 1.8).toFixed(1)} ${I.groundY + 1} q${(lean * 0.3).toFixed(1)} ${(-hh * 0.6).toFixed(1)} ${lean.toFixed(1)} ${(-hh).toFixed(1)} `;
      }
      insetBuckets[inches] += `<path d="${d}" stroke-width="1.6"/>`;
      tuftCount++;
    }
    ins += `<g id="insetGrass" fill="none" stroke="#3f6b3c" stroke-linecap="round" opacity="0.85">`;
    GRASS_BUCKETS.forEach(b => { ins += `<g class="grassH" data-h="${b}">${insetBuckets[b]}</g>`; });
    ins += `</g><rect x="${I.x}" y="${I.groundY}" width="${I.w}" height="${insetBottom - I.groundY}" fill="url(#groundG)"/>`;
    const soil = ['#7d5a3d', '#4b3322', '#8a6a4c', '#2f2117', '#5e4330'];
    for (let i = 0; i < Math.round(I.w * 0.5); i++) {
      ins += `<circle cx="${R(I.x, I.x + I.w).toFixed(1)}" cy="${R(I.groundY + 2, insetBottom).toFixed(1)}" r="${R(0.4, 1.2).toFixed(2)}" fill="${soil[Math.floor(rng() * soil.length)]}" opacity="${R(0.4, 0.85).toFixed(2)}"/>`;
    }
    // Snow layer: flat-topped, the full width of the inset, exactly at the depth.
    ins += `<g id="snowLayerGroup"><rect id="snowRect" x="${I.x}" y="${I.groundY}" width="${I.w}" height="0" fill="url(#snowG)"/>
      <rect id="snowTexRect" x="${I.x}" y="${I.groundY}" width="${I.w}" height="0" fill="url(#snowTex)"/>
      <line id="snowRim" x1="${I.x}" x2="${I.x + I.w}" y1="${I.groundY}" y2="${I.groundY}" stroke="#3b4a66" stroke-width="1.2" opacity="0"/>
      <line id="snowTopLine" x1="${I.x}" x2="${I.x + I.w}" y1="${I.groundY}" y2="${I.groundY}" stroke="#ffffff" stroke-width="1.6" opacity="0"/></g>`;
    // Match overlay: the chosen graph at the inset's own scale — hour 0 on
    // the stake's right edge, one hour as wide as one inch is tall.
    const X = hr => ox + hr * px;
    const yTop = I.yForDepth(D);
    ins += `<g id="overlay" style="display:none">
      <rect x="${ox}" y="${yTop}" width="${ovW}" height="${I.groundY - yTop}" fill="#0b1020" opacity="0.3"/>
      <path id="ovFill" fill="url(#snowG)"/><path id="ovFillTex" fill="url(#snowTex)"/>
      <path id="ovEdge" fill="none" stroke="#ffffff" stroke-width="1.6"/>
      <rect id="ovSplit" x="0" y="${yTop}" width="0" height="${I.groundY - yTop}" fill="#ffffff" opacity="0.08" style="display:none"/><g id="ovGrid">`;
    for (let hr = 0; hr <= SM.MAX_HOURS; hr++) ins += `<line x1="${X(hr)}" x2="${X(hr)}" y1="${yTop}" y2="${I.groundY}" stroke="#8ea2c8" stroke-width="0.7" opacity="${hr % SM.LABEL_EVERY === 0 ? 0.7 : 0.4}"/>`;
    for (let inch = 0; inch <= D; inch++) ins += `<line x1="${ox}" x2="${X(SM.MAX_HOURS)}" y1="${I.yForDepth(inch)}" y2="${I.yForDepth(inch)}" stroke="#8ea2c8" stroke-width="0.7" opacity="${inch % SM.LABEL_EVERY === 0 ? 0.7 : 0.4}"/>`;
    const lfs = Math.max(12, Math.min(16, (insetBottom - I.groundY) * 0.75));
    for (const hr of SM.axisLabels(SM.MAX_HOURS)) {
      if (hr === 0) continue; // hour 0 is the stake itself
      ins += `<text x="${X(hr)}" y="${(I.groundY + (insetBottom - I.groundY) * 0.5 + lfs * 0.35).toFixed(1)}" text-anchor="middle" font-family="Space Mono" font-size="${lfs.toFixed(1)}" font-weight="700" fill="#ffffff" stroke="#1c2541" stroke-width="2.4" stroke-linejoin="round" paint-order="stroke">${hr}</text>`;
    }
    ins += `</g>
      <path id="ovChosenHalo" fill="none" stroke="#1c2541" stroke-width="4.6" stroke-linejoin="round" stroke-linecap="round"/>
      <path id="ovChosen" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
      <path id="ovChosenDash" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-dasharray="5 4" stroke-linecap="butt"/>
      <path id="ovTrueHalo" fill="none" stroke="#1c2541" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
      <path class="ovTruePiece" fill="none" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/>
      <path class="ovTruePiece" fill="none" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/>
      <path class="ovTruePiece" fill="none" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/>
      <g id="ovDiff"></g>
      <line id="ovLink" stroke="#ffd740" stroke-width="1.5" stroke-dasharray="4 3"/>
      <circle id="ovDot" r="5.5" fill="#ffd740" stroke="#1c2541" stroke-width="1.5"/>
      <g id="ovPins"></g>
      <rect id="ovHit" x="${ox}" y="${yTop - 4}" width="${ovW + 6}" height="${I.groundY - yTop + 8}" fill="transparent" style="cursor:crosshair"/>
    </g>`;
    // The big stake: numbers on its LEFT, like a y-axis.
    const sx = I.stakeX, half = 4, sTop = yTop - 7;
    ins += `<rect x="${sx - half}" y="${sTop}" width="${half * 2}" height="${I.groundY - sTop + 10}" rx="1" fill="#8a5a3a" stroke="#5e3c26" stroke-width="1"/>`;
    const labels = new Set(SM.axisLabels(D));
    const fs = Math.max(11, Math.min(14, px * 0.9));
    for (let inch = 0; inch <= D; inch++) {
      const y = I.yForDepth(inch).toFixed(2), major = labels.has(inch);
      const x1 = sx - (major ? 11 : 7), x2 = sx + half + 1;
      ins += `<line class="stake-mark" data-inch="${inch}" x1="${x1}" x2="${x2}" y1="${y}" y2="${y}" stroke="#1c2541" stroke-width="3.2"/>`;
      ins += `<line x1="${x1}" x2="${x2}" y1="${y}" y2="${y}" stroke="#ffffff" stroke-width="1.3"/>`;
      if (major) ins += `<text x="${sx - 13}" y="${(+y + fs * 0.36).toFixed(1)}" text-anchor="end" font-family="Space Mono" font-size="${fs.toFixed(1)}" font-weight="700" fill="#ffffff" stroke="#1c2541" stroke-width="2.2" stroke-linejoin="round" paint-order="stroke">${inch}</text>`;
    }
    ins += `<circle id="stakeAnchor" cx="${sx}" cy="${I.groundY}" r="4" fill="#ffd740" stroke="#1c2541" stroke-width="1"/></g>`;
    // Frame + a small magnifier mark at the corner that points to the small stake.
    ins += `<rect x="${I.x}" y="${I.y}" width="${I.w}" height="${I.h}" rx="9" fill="none" stroke="#ffffff" stroke-opacity="0.65" stroke-width="1.5"/>
      <g transform="translate(${I.x + I.w - 14},${I.y + 13})" opacity="0.85"><circle r="5" fill="#1c2541" stroke="#ffffff" stroke-width="1.4"/><line x1="3.5" y1="3.5" x2="7.5" y2="7.5" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/></g>`;

    sceneSvg.innerHTML = `<defs>${defs}</defs>${sky}${hills}${fg}${cue}${ins}<g id="birdLayer"></g>`;
    const q = s => sceneSvg.querySelector(s);
    el = {
      snowGroup: q('#snowLayerGroup'), snowRect: q('#snowRect'), snowTex: q('#snowTexRect'),
      snowTop: q('#snowTopLine'), snowRim: q('#snowRim'), anchor: q('#stakeAnchor'),
      clouds: q('#cloudGroup'), sun: q('#sunGroup'), moon: q('#moonGroup'), stars: q('#stars'),
      skyStops: sceneSvg.querySelectorAll('.skyStop'), yardStops: sceneSvg.querySelectorAll('.yardStop'),
      insetStops: sceneSvg.querySelectorAll('.insetStop'),
      groundStops: sceneSvg.querySelectorAll('.groundStop'), hillFar: q('#hillFar'), hillNear: q('#hillNear'),
      trees: sceneSvg.querySelectorAll('.farTree'), hillSnow: sceneSvg.querySelectorAll('.hillSnow'),
      birdLayer: q('#birdLayer'),
      perches: [{ x: fx - tw * 0.4, y: poleTop - 4 }, { x: fx + tw * 0.4, y: poleTop - 4 }],
      birdScale: Math.max(0.7, S / 420),
      sunRise: hillsGeo.ridgeNear(w * 0.62) - sunY + sr * 1.2, // px below its high spot: behind the hills
      ov: q('#overlay'), ovFill: q('#ovFill'), ovFillTex: q('#ovFillTex'), ovEdge: q('#ovEdge'), ovSplit: q('#ovSplit'),
      ovChosen: q('#ovChosen'), ovChosenHalo: q('#ovChosenHalo'), ovChosenDash: q('#ovChosenDash'), ovTrueHalo: q('#ovTrueHalo'),
      ovTruePieces: Array.from(sceneSvg.querySelectorAll('.ovTruePiece')), ovDiff: q('#ovDiff'), ovPins: q('#ovPins'), ovHit: q('#ovHit'),
      ovLink: q('#ovLink'), ovDot: q('#ovDot'), ovX0: ox, ovW,
      grass: q('#grass'), insetGrass: q('#insetGrass'),
      grassGroups: Array.from(sceneSvg.querySelectorAll('.grassH')).map(g => ({ g, h: +g.dataset.h, op: 1 })),
      fieldSnow: q('#fieldSnow'), fieldSnowRect: q('#fieldSnow rect'), miniSnow: q('#miniSnow'), tuftCount,
    };
    geom = null;
    applyScene();
    refreshLinkLine();
  }

  // Put the scene at (forecast, hour). neutral: show the depth only, with
  // no weather — used in Match before a pick, so the scene can't leak the
  // first piece's weather.
  function setScene(forecast, hour, opts) {
    scene.forecast = forecast; scene.hour = hour; scene.neutral = !!(opts && opts.neutral);
    return applyScene();
  }
  function paintSky(sun, cloud, snowy) {
    const P = scenePalette(scene.type, sun, cloud);
    [P.sky0, P.sky1, P.sky2].forEach((c, i) => el.skyStops[i].setAttribute('stop-color', c));
    [P.yard0, P.yard1].forEach((c, i) => el.yardStops[i].setAttribute('stop-color', c));
    [P.ground0, P.ground1].forEach((c, i) => el.groundStops[i].setAttribute('stop-color', c));
    el.hillFar.setAttribute('fill', P.hillFar); el.hillNear.setAttribute('fill', P.hillNear);
    el.trees.forEach(tr => tr.setAttribute('fill', P.tree));
    el.grass.setAttribute('stroke', P.grass); el.insetGrass.setAttribute('stroke', P.grass);
    // The inset's backdrop is the near field, a little darker, so the white
    // snow top always reads against it.
    [mixHex(P.yard1, '#0b1020', 0.25), mixHex(P.yard1, '#0b1020', 0.1)].forEach((c, i) => el.insetStops[i].setAttribute('stop-color', c));
    // Snow on the open ground: dim blue-white at night, brighter with the sun.
    el.fieldSnowRect.setAttribute('fill', scene.type === 'night' ? mixHex('#b9c4dc', '#f2f6fc', sun) : '#eef3fa');
    const night = scene.type === 'night';
    el.stars.style.opacity = night ? (1 - sun).toFixed(3) : 0;
    el.moon.style.opacity = night ? (1 - sun).toFixed(3) : 0;
    el.sun.style.opacity = sun.toFixed(3);
    // Night: the sun rises from behind the hills. Day: the clouds part.
    // With reduced motion it fades in place instead of travelling.
    const rise = night && !prefersReducedMotion ? (1 - sun) * el.sunRise : 0;
    el.sun.style.transform = `translateY(${rise.toFixed(1)}px)`;
    el.clouds.style.opacity = cloud.toFixed(3);
    el.clouds.style.transform = `translateX(${((1 - cloud) * L.width * 0.25).toFixed(1)}px)`;
    el.clouds.style.fill = mixHex(P.cloudCloudy, P.cloudSnow, snowy);

  }
  function applyScene() {
    const f = scene.forecast;
    const t = scene.hour;
    const d = f ? SM.depthAt(f, t) : 0;
    const live = !!f && !scene.neutral;
    const wa = live ? SM.weatherAt(f, t) : null;
    const weather = wa ? wa.seg.weather : 'none';
    const rate = wa ? SM.segmentRate(wa.seg) : 0;
    const sun = live ? SM.skyLevel(f, t) : 0;
    const cloud = live ? SM.cloudLevel(f, t) : 0;
    const snowy = live ? SM.blendAt(f, t, s => (s.weather === 'snow' ? 1 : 0)) : 0;
    scene.depth = d; scene.weather = weather; scene.sun = sun;
    scene.tier = weather === 'snow' ? tierForRate(rate) : 0;
    scene.bright = scene.type === 'day' || sun > 0.5; // flakes get a cool-gray edge on bright skies
    if (wa && weather === 'snow') weatherBadge.textContent = `❄️ Snowing — ${SM.rateLabel(wa.seg.rise, wa.seg.run, 'snow').replace('snows ', '')}`;
    else if (weather === 'sun') weatherBadge.textContent = d <= 1e-9 ? '☀️ All melted.' : '☀️ Sunny — melting';
    else if (weather === 'cloudy') weatherBadge.textContent = '☁️ Cloudy';
    else weatherBadge.textContent = '—';
    if (!L) return d;

    // Colors: everything brightens with the sun; day scenes go gray under
    // cloud. Skipped when the sky hasn't changed (most frames mid-storm).
    const skyKey = `${scene.type}|${sun.toFixed(3)}|${cloud.toFixed(3)}|${snowy.toFixed(3)}|${L.width}x${L.height}`;
    if (skyKey !== el.skyKey) { el.skyKey = skyKey; paintSky(sun, cloud, snowy); }
    const top = L.yForDepth(d);
    const show = d > 0.02;
    for (const r of [el.snowRect, el.snowTex]) { r.setAttribute('y', top); r.setAttribute('height', Math.max(0, L.groundY - top)); }
    el.snowRect.style.display = el.snowTex.style.display = show ? '' : 'none';
    el.snowTop.setAttribute('y1', top); el.snowTop.setAttribute('y2', top);
    el.snowTop.setAttribute('opacity', show ? 0.95 : 0);
    // A thin dark rim just above the white edge keeps the reading line
    // visible against anything behind it (pale hills at 15 inches by day).
    el.snowRim.setAttribute('y1', top - 1.3); el.snowRim.setAttribute('y2', top - 1.3);
    el.snowRim.setAttribute('opacity', show ? 0.55 : 0);
    el.anchor.setAttribute('cy', top);
    const whiten = d / SM.MAX_DEPTH;
    // Distant hills whiten with the snow, but only halfway, so they never
    // turn as white as the snow in front of them.
    el.hillSnow.forEach(hs => hs.setAttribute('opacity', (0.5 * whiten).toFixed(3)));
    // Landscape: each grass layer fades out over the inch before the snow
    // reaches its height (and back in as it melts); the whole ground
    // whitens, mostly white by 8 inches; the small stake gets its snow.
    for (const gg of el.grassGroups) {
      const op = Math.max(0, Math.min(1, gg.h - d));
      if (Math.abs(op - gg.op) > 0.004) { gg.op = op; gg.g.style.opacity = op.toFixed(3); gg.g.style.display = op <= 0 ? 'none' : ''; }
    }
    el.fieldSnow.setAttribute('opacity', (0.93 * Math.min(1, d / 8)).toFixed(3));
    const mt = L.mini.yForDepth(d);
    el.miniSnow.setAttribute('y', mt); el.miniSnow.setAttribute('height', Math.max(0, L.mini.baseY - mt + 2));
    el.miniSnow.style.display = d > 0.05 ? '' : 'none';
    drawOverlay();
    return d;
  }

  // ── Match overlay drawing (1A.2 Section 2, 1A.3 Sections 2-3) ──
  // The true forecast's history is the snow fill (0 -> now) and its line
  // is drawn in PIECE COLORS as the dot traces it. The student's chosen
  // graph is the ink line, dashed where it has left the true path (once
  // the dot has reached that stretch). At the verdict the first difference
  // is marked: both rise/run staircases (slope / shape), both starting
  // depths (start) or where each piece ends (length).
  function drawOverlay() {
    const ov = scene.overlay;
    if (!ov || !L) {
      if (el.ov) el.ov.style.display = 'none';
      if (el.snowGroup) el.snowGroup.removeAttribute('clip-path');
      return;
    }
    el.ov.style.display = '';
    el.snowGroup.setAttribute('clip-path', 'url(#ovSnowClip)');
    const X = hr => el.ovX0 + hr * L.pxPerInch, Y = dd => L.yForDepth(dd);
    const P = (hr, f) => `${X(hr).toFixed(2)} ${Y(SM.depthAt(f, hr)).toFixed(2)}`;
    const truth = ov.truth, total = SM.forecastTotalHours(truth);
    const t = Math.max(0, Math.min(total, scene.hour));
    const corners = SM.forecastPoints(truth).map(p => p.t).filter(hr => hr > 0 && hr < t);
    const line = [0].concat(corners, [t]).map(hr => P(hr, truth));
    const fillD = `M ${X(0)} ${L.groundY} L ${line.join(' L ')} L ${X(t)} ${L.groundY} Z`;
    el.ovFill.setAttribute('d', t > 0 ? fillD : '');
    el.ovFillTex.setAttribute('d', t > 0 ? fillD : '');
    el.ovEdge.setAttribute('d', t > 0 ? 'M ' + line.join(' L ') : '');

    // The chosen graph: solid where it is on the true path or the dot
    // hasn't got there yet; dashed where it has visibly split off.
    const tDraw = ov.revealAll ? total : t;
    const chosenF = ov.chosen.forecast;
    const chosenAll = 'M ' + ov.chosen.points.map(p => `${X(p.t).toFixed(2)} ${Y(p.d).toFixed(2)}`).join(' L ');
    el.ovChosenHalo.setAttribute('d', chosenAll);
    let solid = '', dashed = '';
    for (const [a, b] of stretches(truth, chosenF)) {
      const off = Math.abs(SM.depthAt(truth, a) - SM.depthAt(chosenF, a)) > 1e-6 || Math.abs(SM.depthAt(truth, b) - SM.depthAt(chosenF, b)) > 1e-6;
      const seg = `M ${P(a, chosenF)} L ${P(b, chosenF)} `;
      if (off && a < tDraw) dashed += seg; else solid += seg;
    }
    el.ovChosen.setAttribute('d', solid); el.ovChosenDash.setAttribute('d', dashed);

    // The true path in piece colors, up to the dot (all of it at the verdict).
    let halo = '';
    SM.pieceSpans(truth).forEach((sp, i) => {
      const path = el.ovTruePieces[i];
      if (!path) return;
      if (sp.t0 >= tDraw && !(sp.t0 === 0 && tDraw === 0)) { path.setAttribute('d', ''); return; }
      const end = Math.min(sp.t1, tDraw);
      const d = end > sp.t0 ? `M ${P(sp.t0, truth)} L ${P(end, truth)}` : '';
      path.setAttribute('d', d); path.setAttribute('stroke', SM.PIECE_COLORS.scene[i % 3]);
      halo += d + ' ';
    });
    el.ovTrueHalo.setAttribute('d', halo);

    // The first difference, marked at the verdict.
    const df = ov.revealAll ? ov.diff : null;
    let marks = '';
    if (df && (df.kind === 'slope' || df.kind === 'shape')) {
      const x0 = df.truth.t0, d0 = df.truth.d0;
      for (const [p, color] of [[df.mine, '#ffffff'], [df.truth, SM.PIECE_COLORS.scene[df.pieceIndex % 3]]]) {
        const xr = X(x0 + p.run), yb = Y(d0), yt = Y(d0 + p.rise);
        marks += `<line x1="${X(x0)}" x2="${xr}" y1="${yb}" y2="${yb}" stroke="#1c2541" stroke-width="5"/><line x1="${X(x0)}" x2="${xr}" y1="${yb}" y2="${yb}" stroke="${runBlue}" stroke-width="2.6" stroke-dasharray="5 3"/>`;
        if (p.rise) marks += `<line x1="${xr}" x2="${xr}" y1="${yb}" y2="${yt}" stroke="#1c2541" stroke-width="5"/><line x1="${xr}" x2="${xr}" y1="${yb}" y2="${yt}" stroke="${riseOrange}" stroke-width="2.6" stroke-dasharray="5 3"/>`;
        marks += `<circle cx="${xr}" cy="${yt}" r="4" fill="${color}" stroke="#1c2541" stroke-width="1.5"/>`;
      }
      const sp = SM.pieceSpans(truth)[df.pieceIndex];
      el.ovSplit.setAttribute('x', X(sp.t0)); el.ovSplit.setAttribute('width', X(sp.t1) - X(sp.t0)); el.ovSplit.style.display = '';
    } else el.ovSplit.style.display = 'none';
    if (df && df.kind === 'start') {
      marks += `<circle cx="${X(0)}" cy="${Y(df.mine.start)}" r="7" fill="none" stroke="#ffffff" stroke-width="2.5"/>`;
      marks += `<circle cx="${X(0)}" cy="${Y(df.truth.start)}" r="7" fill="none" stroke="${SM.PIECE_COLORS.scene[0]}" stroke-width="3"/>`;
    }
    if (df && df.kind === 'length') {
      marks += `<circle cx="${X(df.mine.end)}" cy="${Y(SM.depthAt(chosenF, df.mine.end))}" r="7" fill="none" stroke="#ffffff" stroke-width="2.5"/>`;
      marks += `<circle cx="${X(df.truth.end)}" cy="${Y(SM.depthAt(truth, df.truth.end))}" r="7" fill="none" stroke="${SM.PIECE_COLORS.scene[df.pieceIndex % 3]}" stroke-width="3"/>`;
    }
    el.ovDiff.innerHTML = marks;

    const dy = Y(SM.depthAt(truth, t));
    el.ovDot.setAttribute('cx', X(t)); el.ovDot.setAttribute('cy', dy);
    el.ovLink.setAttribute('x1', el.ovX0 - 8); el.ovLink.setAttribute('x2', X(t));
    el.ovLink.setAttribute('y1', dy); el.ovLink.setAttribute('y2', dy);
    drawOverlayPins();
  }
  // Breakpoints at both graphs' corners: each stretch is straight on both.
  function stretches(a, b) {
    const end = Math.min(SM.forecastTotalHours(a), SM.forecastTotalHours(b));
    const hrs = new Set([0, end]);
    for (const p of SM.forecastPoints(a)) if (p.t < end) hrs.add(p.t);
    for (const p of SM.forecastPoints(b)) if (p.t < end) hrs.add(p.t);
    const ts = Array.from(hrs).sort((x, y) => x - y);
    const out = [];
    for (let k = 0; k < ts.length - 1; k++) if (ts[k + 1] > ts[k]) out.push([ts[k], ts[k + 1]]);
    return out;
  }
  // Pins and the hover dot on the overlay (same look as the chart's).
  function drawOverlayPins() {
    if (!el.ovPins) return;
    const ov = scene.overlay;
    if (!ov || mode !== 'match') { el.ovPins.innerHTML = ''; return; }
    const X = hr => el.ovX0 + hr * L.pxPerInch, Y = dd => L.yForDepth(dd);
    const tag = (p, fill, big) => {
      const x = X(p.t), y = Y(p.d), label = ptLabel(p), fs = big ? 16 : 14;
      const w = label.length * fs * 0.62 + 10;
      const lx = Math.max(L.inset.x + 2, Math.min(L.inset.x + L.inset.w - w - 2, x - w / 2));
      const ly = y - 14 - fs < L.inset.y + 2 ? y + 12 : y - 14 - fs;
      return `<circle cx="${x}" cy="${y}" r="${big ? 6.5 : 5.5}" fill="${fill}" stroke="#ffffff" stroke-width="2" opacity="${big ? 0.85 : 1}"/>
        <rect x="${lx}" y="${ly}" width="${w}" height="${fs + 7}" rx="3" fill="rgba(15,17,23,0.9)"/>
        <text x="${lx + w / 2}" y="${ly + fs + 1}" text-anchor="middle" font-family="Space Mono" font-weight="700" font-size="${fs}" fill="#ffffff">${label}</text>`;
    };
    let h = '';
    for (const p of ovPins) h += tag(p, '#ff4081', false);
    if (ovHover) {
      const x = X(ovHover.t), y = Y(ovHover.d);
      h += `<line x1="${x}" x2="${x}" y1="${y}" y2="${L.groundY}" stroke="#ffd740" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="4 4"/>
        <line x1="${el.ovX0}" x2="${x}" y1="${y}" y2="${y}" stroke="#ffd740" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="4 4"/>`;
      h += tag(ovHover, '#ffd740', true);
    }
    el.ovPins.innerHTML = h;
  }

  // ── Falling snow (canvas) and the occasional bird ──
  // Background flakes are small and slow and fade out over the hills;
  // foreground flakes are bigger and faster and fall to the snow surface,
  // where they squash and fade in about a quarter second.
  const flakes = [];
  const birds = [];
  let nextBirdAt = performance.now() + (URLP.birdsSoon ? 1000 : (BIRD_MIN_S + Math.random() * (BIRD_MAX_S - BIRD_MIN_S)) * 1000);
  // Foreground flakes fall in perspective: each picks a ground row to land
  // on (near rows: bigger and faster; far rows: small and slow). Flakes
  // over the inset land on the inset's snow top instead.
  function spawnFlake(layer, initial) {
    const h = L.height, I = L.inset;
    const x = Math.random() * L.width;
    const y = -3 - Math.random() * h * (initial ? 0.6 : 0.12);
    if (layer === 'bg') {
      const r = 0.7 + Math.random() * 0.6;
      flakes.push({ layer, r, x, y, vy: h * (0.09 + Math.random() * 0.06), sway: 5 * Math.random(), phase: Math.random() * 6.28, landedAt: 0 });
      return;
    }
    const near = Math.pow(Math.random(), 0.6);                 // 0 = horizon … 1 = bottom edge
    const landY = L.fgTop + (h - L.fgTop) * near;
    const inInset = x > I.x && x < I.x + I.w && landY > I.y;
    const s = inInset ? 1 : near;
    flakes.push({
      layer, inInset, landY, r: 0.8 + s * 2.1 + Math.random() * 0.5, x, y,
      vy: h * (0.13 + s * 0.28 + Math.random() * 0.06),
      sway: (4 + s * 8) * Math.random(), phase: Math.random() * 6.28, landedAt: 0,
    });
  }
  // ── Flavor events (Phase 1A.2, Section 5) ──
  // Rare, one at a time, drawn on the snow canvas: a plane (blinking lights
  // at night, a faint trail by day), a shooting star (night only), or a few
  // birds crossing the sky (day only). Never in the first 2 seconds; never
  // with reduced motion (the animation loop doesn't run then).
  const FLAVOR_MIN_S = 20, FLAVOR_MAX_S = 60;
  const FLAVOR_KINDS = ['plane', 'shooting', 'birds'];
  const forcedFlavor = FLAVOR_KINDS.includes(URLP.flavor) ? URLP.flavor : null;
  const flavorGap = () => (FLAVOR_MIN_S + Math.random() * (FLAVOR_MAX_S - FLAVOR_MIN_S)) * 1000;
  let nextFlavorAt = performance.now() + (URLP.flavor ? 1000 : Math.max(2000, flavorGap()));
  let flavor = null;
  function startFlavor(now) {
    const kinds = forcedFlavor ? [forcedFlavor] : (scene.type === 'night' && scene.sun < 0.5 ? ['plane', 'shooting'] : ['plane', 'birds']);
    const kind = kinds[Math.floor(Math.random() * kinds.length)];
    const dir = Math.random() < 0.5 ? 1 : -1;
    const band = L.fgTop - L.skyBottom;
    if (kind === 'plane') flavor = { kind, t0: now, dur: 16000, dir, y: Math.min(L.skyBottom + band * (0.05 + Math.random() * 0.15), L.inset.y - 14) };
    else if (kind === 'shooting') flavor = { kind, t0: now, dur: 900, x0: L.width * (0.45 + Math.random() * 0.45), y0: L.skyBottom * (0.1 + Math.random() * 0.3), dx: -L.width * 0.35, dy: L.skyBottom * 0.45 };
    else flavor = { kind, t0: now, dur: 9000, dir, y: L.skyBottom * (0.35 + Math.random() * 0.35), n: 2 + Math.floor(Math.random() * 2) };
  }
  function drawFlavor(now) {
    const f = flavor, p = (now - f.t0) / f.dur;
    if (p >= 1) { flavor = null; nextFlavorAt = now + flavorGap(); return; }
    const W = L.width, ctx = fctx;
    ctx.save();
    if (f.kind === 'plane') {
      const x = f.dir > 0 ? -30 + (W + 60) * p : W + 30 - (W + 60) * p;
      const dark = scene.type === 'night' && scene.sun < 0.5;
      if (!dark) {
        const g = ctx.createLinearGradient(x, f.y, x - f.dir * W * 0.35, f.y);
        g.addColorStop(0, 'rgba(255,255,255,0.55)'); g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.strokeStyle = g; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(x - f.dir * 7, f.y); ctx.lineTo(x - f.dir * W * 0.35, f.y); ctx.stroke();
      }
      ctx.translate(x, f.y); ctx.scale(f.dir, 1);
      ctx.fillStyle = dark ? '#151a2e' : '#eef1f6';
      ctx.beginPath(); ctx.ellipse(0, 0, 7, 1.4, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-1, 0); ctx.lineTo(-4, -4.5); ctx.lineTo(-2, -4.5); ctx.lineTo(2, 0); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-6, 0); ctx.lineTo(-7.5, -3); ctx.lineTo(-6.3, -3); ctx.lineTo(-4.8, 0); ctx.closePath(); ctx.fill();
      if (dark) {
        ctx.fillStyle = Math.floor(now / 600) % 2 ? '#ff4545' : '#45ff78';
        ctx.beginPath(); ctx.arc(-3.5, -4.3, 1.2, 0, Math.PI * 2); ctx.fill();
        if (Math.floor(now / 200) % 6 === 0) { ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(0.5, -1.2, 1.3, 0, Math.PI * 2); ctx.fill(); }
      }
    } else if (f.kind === 'shooting') {
      const x = f.x0 + f.dx * p, y = f.y0 + f.dy * p;
      const tp = Math.max(0, p - 0.35);
      const tx = f.x0 + f.dx * tp, ty = f.y0 + f.dy * tp;
      const a = p < 0.8 ? 1 : (1 - p) / 0.2;
      const g = ctx.createLinearGradient(x, y, tx, ty);
      g.addColorStop(0, `rgba(255,255,255,${(0.95 * a).toFixed(2)})`); g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.strokeStyle = g; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(tx, ty); ctx.stroke();
    } else {
      ctx.strokeStyle = '#2c3340'; ctx.lineWidth = 1.5; ctx.lineCap = 'round';
      for (let k = 0; k < f.n; k++) {
        const bx = (f.dir > 0 ? -20 + (W + 40) * p : W + 20 - (W + 40) * p) - f.dir * k * 16;
        const by = f.y + k * 7 + Math.sin(now / 400 + k) * 2;
        const flap = Math.sin(now / 110 + k * 1.7) * 3;
        ctx.beginPath(); ctx.moveTo(bx - 5, by - flap); ctx.quadraticCurveTo(bx - 2, by - 1, bx, by + 1);
        ctx.quadraticCurveTo(bx + 2, by - 1, bx + 5, by - flap); ctx.stroke();
      }
    }
    ctx.restore();
  }

  // Performance fallback: every PERF_WINDOW_MS, if frames averaged slower
  // than PERF_SLOW_MS (~35 fps), shed one level: 1 = no flavor events,
  // 2 = 60% of the flakes and playback redraws at 30 Hz, 3 = 35% of the
  // flakes. Levels never come back up during a visit. ?quality=0..3 pins
  // a level (testing).
  const PERF_SLOW_MS = 28, PERF_WINDOW_MS = 2000;
  const FLAKE_SCALE = [1, 1, 0.6, 0.35];
  const pinnedQuality = /^[0-3]$/.test(URLP.quality || '') ? +URLP.quality : null;
  let perfLevel = pinnedQuality || 0, perfAcc = 0, perfFrames = 0;
  document.documentElement.dataset.perfLevel = perfLevel;
  let lastFrame = performance.now(), lastTier = 0;
  function frame(now) {
    const raw = now - lastFrame;
    const dt = Math.min(0.05, raw / 1000);
    lastFrame = now;
    if (pinnedQuality === null && raw < 250 && !document.hidden) { // ignore gaps (hidden tab, long pauses)
      perfAcc += raw; perfFrames++;
      if (perfAcc >= PERF_WINDOW_MS) {
        if (perfAcc / perfFrames > PERF_SLOW_MS && perfLevel < 3) {
          perfLevel++;
          if (perfLevel >= 1) flavor = null;
          document.documentElement.dataset.perfLevel = perfLevel;
          console.info(`Snow Challenge: running slowly (${(perfAcc / perfFrames).toFixed(0)} ms/frame); lightened the scene to level ${perfLevel}.`);
        }
        perfAcc = 0; perfFrames = 0;
      }
    }
    if (L) {
      const want = FLAKE_TIERS[scene.tier].map(n => Math.round(n * FLAKE_SCALE[perfLevel]));
      let bg = 0, fgc = 0;
      for (const f of flakes) { if (f.layer === 'bg') bg++; else fgc++; }
      const fresh = scene.tier > 0 && lastTier === 0; // snow just started: fill from the top edge
      let budget = fresh ? 999 : 4;
      while (bg < want[0] && budget-- > 0) { spawnFlake('bg', fresh); bg++; }
      budget = fresh ? 999 : 4;
      while (fgc < want[1] && budget-- > 0) { spawnFlake('fg', fresh); fgc++; }
      lastTier = scene.tier;

      const insetSurface = L.yForDepth(scene.depth);
      const fadeTop = L.skyBottom, fadeBottom = L.fgTop;
      fctx.clearRect(0, 0, L.width, L.height);
      if (!flavor && perfLevel === 0 && now >= nextFlavorAt) startFlavor(now);
      if (flavor) drawFlavor(now);
      // On bright skies white flakes vanish: give them a cool-gray edge.
      fctx.fillStyle = scene.bright ? '#f6f8fc' : '#ffffff';
      fctx.strokeStyle = 'rgba(92,108,140,0.6)'; fctx.lineWidth = 0.7;
      for (let i = flakes.length - 1; i >= 0; i--) {
        const f = flakes[i];
        let alpha = f.layer === 'fg' ? 0.95 : 0.7, sx = 1, sy = 1;
        if (f.landedAt) {
          const p = (now - f.landedAt) / LAND_MS;
          if (p >= 1) { flakes.splice(i, 1); continue; }
          sx = 1 + p * 0.9; sy = Math.max(0.15, 1 - p * 0.85); alpha *= 1 - p;
          if (f.inInset) f.y = insetSurface - f.r * sy * 0.5; // ride the inset's snow top as it rises
        } else {
          f.y += f.vy * dt;
          f.x += Math.sin(f.phase + f.y * 0.03) * f.sway * dt;
          if (f.layer === 'bg') {
            if (f.y > fadeBottom) { flakes.splice(i, 1); continue; }
            if (f.y > fadeTop) alpha *= Math.max(0, (fadeBottom - f.y) / (fadeBottom - fadeTop));
          } else {
            const surface = f.inInset ? insetSurface : f.landY;
            if (f.y + f.r >= surface) { f.landedAt = now; f.y = surface - f.r * 0.5; }
          }
        }
        if (alpha <= 0.01) continue;
        fctx.globalAlpha = alpha;
        fctx.beginPath();
        fctx.ellipse(f.x, f.y, f.r * sx, f.r * sy, 0, 0, Math.PI * 2);
        fctx.fill();
        if (scene.bright) fctx.stroke();
      }
      fctx.globalAlpha = 1;
      updateBirds(now, dt);
    }
    requestAnimationFrame(frame);
  }

  // A bird: dark body, rusty breast, flapping wing. Flies in from the side,
  // perches on the feeder for a few seconds, flies off. Never in heavy snow.
  function makeBird() {
    const g = svgEl('g', { class: 'bird' }, el.birdLayer);
    svgEl('ellipse', { cx: 0, cy: 0, rx: 6.5, ry: 4.4, fill: '#3b4054' }, g);
    svgEl('ellipse', { cx: 2.2, cy: 1.4, rx: 3.6, ry: 2.8, fill: '#c5684b' }, g);
    svgEl('circle', { cx: 5.2, cy: -3, r: 3.2, fill: '#3b4054' }, g);
    svgEl('circle', { cx: 6.2, cy: -3.6, r: 0.7, fill: '#ffffff' }, g);
    svgEl('polygon', { points: '8,-3.4 11,-2.6 8,-2', fill: '#e3a63c' }, g);
    svgEl('polygon', { points: '-6,-1 -11,-3 -10,1', fill: '#2c3040' }, g);
    const wing = svgEl('path', { d: 'M -3 -1 Q 1 -9 4 -1 Z', fill: '#2c3040' }, g);
    return { g, wing };
  }
  function updateBirds(now, dt) {
    if (now >= nextBirdAt) {
      nextBirdAt = now + (BIRD_MIN_S + Math.random() * (BIRD_MAX_S - BIRD_MIN_S)) * 1000;
      if (scene.tier < 3 && !birds.length && el.perches) {
        const count = Math.random() < 0.35 ? 2 : 1;
        for (let k = 0; k < count; k++) {
          const perch = el.perches[k];
          const fromRight = Math.random() < 0.5;
          const b = makeBird();
          birds.push(Object.assign(b, {
            phase: 'in', t: 0, dur: 1.4 + k * 0.3,
            from: { x: fromRight ? L.width + 20 : -20, y: L.height * (0.08 + Math.random() * 0.15) },
            to: perch, stay: 3 + Math.random() * 3, dirIn: fromRight ? -1 : 1,
          }));
        }
      }
    }
    for (let i = birds.length - 1; i >= 0; i--) {
      const b = birds[i];
      b.t += dt;
      let x, y, flapping = true, dir;
      if (b.phase === 'in') {
        const p = Math.min(1, b.t / b.dur), e = 1 - Math.pow(1 - p, 2);
        x = b.from.x + (b.to.x - b.from.x) * e;
        y = b.from.y + (b.to.y - b.from.y) * e - Math.sin(p * Math.PI) * L.height * 0.05;
        dir = b.dirIn;
        if (p >= 1) { b.phase = 'perch'; b.t = 0; }
      } else if (b.phase === 'perch') {
        x = b.to.x; y = b.to.y - Math.abs(Math.sin(b.t * 2.2)) * 1.2; flapping = false; dir = b.dirIn;
        if (b.t >= b.stay) { b.phase = 'out'; b.t = 0; b.out = { x: b.dirIn > 0 ? L.width + 30 : -30, y: L.height * 0.05 }; }
      } else {
        const p = Math.min(1, b.t / 1.2), e = p * p;
        x = b.to.x + (b.out.x - b.to.x) * e; y = b.to.y + (b.out.y - b.to.y) * e;
        dir = b.dirIn;
        if (p >= 1) { b.g.remove(); birds.splice(i, 1); continue; }
      }
      const s = el.birdScale;
      b.g.setAttribute('transform', `translate(${x.toFixed(1)},${(y - 4.4 * s).toFixed(1)}) scale(${(dir * s).toFixed(2)},${s.toFixed(2)})`);
      b.wing.setAttribute('transform', flapping ? `scale(1,${Math.sin(performance.now() / 45) > 0 ? 1 : -0.6})` : 'scale(1,0.5)');
    }
  }

  new ResizeObserver(() => buildScene()).observe(sceneWrap);
  if (!prefersReducedMotion) requestAnimationFrame(frame); // no flakes or birds with reduced motion

  // Connects the top of the snow on the stake to the matching point on
  // the graph (current hour, current depth). The stake and the graph use
  // different scales, so the line ends exactly on the plotted point.
  const linkDot = document.getElementById('linkDot');
  const contentEl = document.getElementById('content');
  const invalidateGeom = () => { geom = null; };
  window.addEventListener('resize', invalidateGeom);
  function updateLinkLine(depthInches, atHour) {
    if (depthInches == null || !linkLineOn() || !el.anchor) {
      linkLine.setAttribute('opacity', 0); linkDot.setAttribute('opacity', 0); return;
    }
    // Page positions are measured once and reused until the layout changes
    // (resize, mode switch, story toggle, scene rebuild). Re-measuring every
    // frame forced the browser to lay out the page 60 times a second.
    if (!geom) geom = { svg: sceneSvg.getBoundingClientRect(), chart: document.getElementById('chart').getBoundingClientRect(), box: contentEl.getBoundingClientRect() };
    const x1 = geom.svg.left + +el.anchor.getAttribute('cx') - geom.box.left;
    const y1 = geom.svg.top + +el.anchor.getAttribute('cy') - geom.box.top;
    const x2 = geom.chart.left - geom.box.left + chart.scales.x.getPixelForValue(atHour == null ? playbackHour : atHour);
    const y2 = geom.chart.top - geom.box.top + chart.scales.y.getPixelForValue(depthInches);
    linkLine.setAttribute('x1', x1); linkLine.setAttribute('y1', y1);
    linkLine.setAttribute('x2', x2); linkLine.setAttribute('y2', y2);
    linkDot.setAttribute('cx', x2); linkDot.setAttribute('cy', y2);
    linkLine.setAttribute('opacity', 0.6); linkDot.setAttribute('opacity', 1);
  }
  function refreshLinkLine() {
    const f = activeForecast();
    if (f && linkLineOn()) updateLinkLine(SM.depthAt(f, playbackHour));
  }
  window.addEventListener('resize', refreshLinkLine);

  // ══════════════════════════════════════════════════════════════
  // TIMELINE SLIDER (Spec v2, 4a). The scene always matches the thumb.
  // Arrow keys move 1 hour (Shift: 1/4 hour), snapping to that grid.
  // ══════════════════════════════════════════════════════════════
  const SLIDER_STEP = 1, SLIDER_FINE_STEP = 0.25;
  const timeline = document.getElementById('timeline');
  const timeSlider = document.getElementById('timeSlider');
  const hourReadout = document.getElementById('hourReadout');
  const hourOf = document.getElementById('hourOf');
  const tlTicks = document.getElementById('tlTicks');
  const tlLock = document.getElementById('tlLock');
  let timelineTotal = 0;
  let playbackHour = 0;

  function formatHour(t) {
    const q = Math.round(t * 4);
    if (Math.abs(t * 4 - q) < 1e-6) {
      const whole = Math.floor(q / 4), frac = ['', '¼', '½', '¾'][q % 4];
      return whole === 0 && frac ? frac : `${whole}${frac}`;
    }
    return t.toFixed(1);
  }
  function setTimeline(total, locked) {
    timelineTotal = total;
    timeSlider.max = total;
    timeSlider.disabled = !!locked;
    timeline.classList.toggle('is-locked', !!locked);
    tlLock.hidden = !locked;
    hourOf.textContent = `of ${total}`;
    const labels = new Set(SM.axisLabels(total));
    tlTicks.innerHTML = '';
    for (let hr = 0; hr <= total; hr++) {
      const t = document.createElement('div');
      t.className = 'tl-tick' + (labels.has(hr) ? ' major' : '');
      t.style.left = (total ? hr / total * 100 : 0) + '%';
      if (labels.has(hr)) { const s = document.createElement('span'); s.textContent = hr; t.appendChild(s); }
      tlTicks.appendChild(t);
    }
    updateSliderUI();
  }
  function updateSliderUI() {
    timeSlider.value = playbackHour;
    timeSlider.style.setProperty('--pct', (timelineTotal ? playbackHour / timelineTotal * 100 : 0) + '%');
    hourReadout.textContent = formatHour(playbackHour);
    timeSlider.setAttribute('aria-valuetext', `Hour ${formatHour(playbackHour)}`);
  }
  // The forecast the slider and scene play right now (null = locked).
  function activeForecast() {
    if (mode === 'explorer') return currentExplorerForecast();
    if (mode === 'match') return currentMatchItem && matchPhase !== 'pick' ? currentMatchItem.correct : null;
    return null;
  }
  // The story element whose current piece is emphasized during a trace.
  function tracedStoryEl() {
    if (mode === 'explorer') return storyText;
    if (mode === 'match') return challengeStory;
    return null;
  }
  const linkLineOn = () => mode === 'explorer';
  function seek(t) {
    const f = activeForecast();
    if (!f) return;
    playbackHour = Math.max(0, Math.min(SM.forecastTotalHours(f), t));
    if (mode !== 'match') renderChart(playbackHour);
    const d = setScene(f, playbackHour);
    updateLinkLine(linkLineOn() ? d : null);
    updateSliderUI();
    markStoryPiece(tracedStoryEl(), f, playbackHour);
    // The verdict arrives when the trace reaches the end.
    if (mode === 'match' && matchPhase === 'reveal' && playbackHour >= SM.forecastTotalHours(f) - 1e-9) showVerdict();
  }
  timeSlider.addEventListener('input', () => { clearAutoplay(); stopPlayback(); seek(+timeSlider.value); });
  timeSlider.addEventListener('keydown', e => {
    const dir = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1 }[e.key];
    if (!dir) return;
    e.preventDefault();
    const step = e.shiftKey ? SLIDER_FINE_STEP : SLIDER_STEP;
    const target = dir > 0
      ? (Math.floor(playbackHour / step + 1e-6) + 1) * step
      : (Math.ceil(playbackHour / step - 1e-6) - 1) * step;
    clearAutoplay();
    stopPlayback();
    seek(target);
  });

  const tlHint = document.getElementById('tlHint');
  const HINT_SHOW_MS = 4000;
  let hintTimer = null;
  function showHint() {
    tlHint.classList.add('show');
    clearTimeout(hintTimer);
    hintTimer = setTimeout(() => tlHint.classList.remove('show'), HINT_SHOW_MS);
  }
  timeSlider.addEventListener('mouseenter', showHint);
  timeSlider.addEventListener('focus', showHint);
  timeSlider.addEventListener('pointerdown', showHint);

  // ══════════════════════════════════════════════════════════════
  // EXPLORER — builder state + live graph/story
  // Every choice comes from the model's Explorer rules: only options that
  // fit are listed, and ones that would break a LATER piece are greyed
  // with a reason. Later pieces are never changed behind the student's back.
  // ══════════════════════════════════════════════════════════════
  const startDepthHost = document.getElementById('startDepthHost');
  const segmentRows = document.getElementById('segmentRows');
  const addSegmentBtn = document.getElementById('addSegmentBtn');
  const builderMsg = document.getElementById('builderMsg');
  let explorerStart = 2;
  let explorerSegments = [{ weather: 'snow', rise: 1, run: 3, hours: 6 }]; // friendly default, matches the v1 spec's example
  const WEATHER_LABEL = { snow: 'Snowing', cloudy: 'Cloudy', sun: 'Sunny (melting)' };

  function currentExplorerForecast() {
    return { start: explorerStart, segments: explorerSegments.map(s => Object.assign({}, s)) };
  }
  function afterEdit() {
    builderMsg.textContent = '';
    renderSegmentRows();
    renderExplorerAtRest();
  }

  function renderSegmentRows() {
    const f = currentExplorerForecast();
    startDepthHost.replaceChildren(makePicker({
      label: 'Starting depth',
      options: SM.startOptions(f).map(o => Object.assign({ label: String(o.value) }, o)),
      value: f.start,
      onChange: v => { explorerStart = v; afterEdit(); },
    }));

    segmentRows.innerHTML = '';
    f.segments.forEach((seg, i) => {
      const row = document.createElement('div');
      row.className = 'segment-row';
      row.style.setProperty('--piece-color', `var(--piece-${i + 1})`);
      const tag = document.createElement('span');
      tag.className = 'seg-label'; tag.textContent = `Piece ${i + 1}`;
      row.appendChild(tag);
      row.appendChild(makePicker({
        label: `Piece ${i + 1} weather`,
        options: SM.weatherOptions(f, i).map(o => Object.assign({ label: WEATHER_LABEL[o.value] }, o)),
        value: seg.weather,
        onChange: w => { explorerSegments[i] = SM.bestPiece(f, i, w, seg); afterEdit(); },
      }));
      if (seg.weather !== 'cloudy') {
        row.appendChild(makePicker({
          label: `Piece ${i + 1} rate`,
          options: SM.rateOptions(f, i, seg.weather).map(o => ({ value: `${o.rise},${o.run}`, label: SM.rateLabel(o.rise, o.run, seg.weather), ok: o.ok, reason: o.reason })),
          value: `${seg.rise},${seg.run}`,
          onChange: v => {
            const [r, u] = v.split(',').map(Number);
            explorerSegments[i] = SM.bestPiece(f, i, seg.weather, { rise: r, run: u, hours: seg.hours });
            afterEdit();
          },
        }));
      }
      row.appendChild(makePicker({
        label: `Piece ${i + 1} hours`,
        options: SM.hourOptions(f, i, seg.weather, seg.rise, seg.run).map(o => Object.assign({ label: `${o.value}h` }, o)),
        value: seg.hours,
        onChange: h => { explorerSegments[i] = Object.assign({}, seg, { hours: h }); afterEdit(); },
      }));
      if (f.segments.length > 1) {
        const rc = SM.removeCheck(f, i);
        const rm = document.createElement('button');
        rm.className = 'seg-remove'; rm.type = 'button'; rm.textContent = '✕';
        rm.setAttribute('aria-label', `Remove piece ${i + 1}`);
        if (!rc.ok) { rm.setAttribute('aria-disabled', 'true'); rm.title = rc.reason; }
        rm.onclick = () => {
          if (!rc.ok) { builderMsg.textContent = rc.reason; return; } // tap shows why
          explorerSegments.splice(i, 1); afterEdit();
        };
        row.appendChild(rm);
      }
      segmentRows.appendChild(row);
    });

    const ac = SM.addCheck(f);
    addSegmentBtn.setAttribute('aria-disabled', String(!ac.ok));
    addSegmentBtn.title = ac.ok ? '' : ac.reason;
    addSegmentBtn.onclick = () => {
      if (!ac.ok) { builderMsg.textContent = ac.reason; return; }
      explorerSegments.push(ac.piece); afterEdit();
    };
  }

  const toggleSteps = document.getElementById('toggleSteps');
  const toggleStory = document.getElementById('toggleStory');
  const storyText = document.getElementById('storyText');
  toggleStory.onchange = () => {
    geom = null;
    storyText.classList.toggle('hidden', !toggleStory.checked);
    renderStory(storyText, currentExplorerForecast(), true);
  };
  toggleSteps.onchange = () => renderChart(playbackHour);

  // ── The story, split by piece (1A.3, Section 2) ──
  // Each piece's sentence is its own span so it can take its piece color;
  // the starting-depth sentence stays plain.
  function renderStory(el, forecast, colored) {
    const parts = SM.forecastStoryParts(forecast);
    el.textContent = '';
    const st = document.createElement('span');
    st.className = 'story-start'; st.textContent = parts.start;
    el.appendChild(st);
    parts.pieces.forEach((text, i) => {
      el.appendChild(document.createTextNode(' '));
      const sp = document.createElement('span');
      sp.className = 'story-piece'; sp.dataset.piece = i; sp.textContent = text;
      el.appendChild(sp);
    });
    el.classList.toggle('colored', !!colored);
    el.classList.remove('tracing');
  }
  // While the dot is mid-story, emphasize the piece it is in.
  function markStoryPiece(el, forecast, t) {
    if (!el || !forecast || !el.classList.contains('colored')) return;
    const total = SM.forecastTotalHours(forecast);
    const tracing = t > 1e-9 && t < total - 1e-9;
    el.classList.toggle('tracing', tracing);
    const idx = tracing ? SM.pieceIndexAt(forecast, t) : -1;
    el.querySelectorAll('.story-piece').forEach(sp => sp.classList.toggle('is-current', +sp.dataset.piece === idx));
  }

  function stepPoints(forecast, uptoHour) {
    // Rise/run staircase for whatever has been drawn up to `uptoHour`. The
    // unit step (run, rise) REPEATS across each piece (a 6-hour "1 inch
    // every 3 hours" piece draws two 3h/1in steps).
    const runPts = [], risePts = [], labels = [];
    let t = 0, d = forecast.start;
    for (const seg of forecast.segments) {
      if (seg.weather === 'cloudy' || t >= uptoHour) { t += seg.hours; d += SM.segmentDelta(seg); continue; }
      const reps = seg.hours / seg.run;
      let segT = t, segD = d;
      for (let r = 0; r < reps && segT < uptoHour; r++) {
        const runEnd = Math.min(segT + seg.run, uptoHour);
        runPts.push({ x: segT, y: segD }, { x: runEnd, y: segD }, { x: NaN, y: NaN });
        if (runEnd >= segT + seg.run) {
          const newD = segD + seg.rise;
          risePts.push({ x: runEnd, y: segD }, { x: runEnd, y: newD }, { x: NaN, y: NaN });
          labels.push({ kind: 'run', x0: segT, x1: runEnd, y: segD, melting: seg.rise < 0, firstOfSeg: r === 0,
            text: seg.run === 1 ? '1 hour' : `${seg.run} hours` });
          labels.push({ kind: 'rise', x: runEnd, y0: segD, y1: newD, firstOfSeg: r === 0,
            text: `${seg.rise < 0 ? '−' : '+'}${Math.abs(seg.rise)} ${Math.abs(seg.rise) === 1 ? 'inch' : 'inches'}` });
          segD = newD;
        }
        segT += seg.run;
      }
      t += seg.hours; d += SM.segmentDelta(seg);
    }
    return { runPts, risePts, labels };
  }

  // Explorer: the graph is drawn up to the slider in piece colors, with
  // the snow fill under it (the rise/run toggle adds the steps).
  function setExplorerView() {
    const f = currentExplorerForecast();
    Object.assign(chartView, { main: null, trace: f, fill: f, traceAll: false, steps: f, hover: f, markers: [], diffSteps: null });
  }
  function renderExplorerAtRest() {
    stopPlayback();
    playbackHour = 0;
    clearPins();
    const forecast = currentExplorerForecast();
    setExplorerView();
    renderStory(storyText, forecast, true);
    setTimeline(SM.forecastTotalHours(forecast), false);
    seek(0);
  }

  // ══════════════════════════════════════════════════════════════
  // PLAYBACK — shared by Explorer and Match's post-pick reveal. Runs on
  // animation frames, so the snow top rises smoothly; Play resumes from
  // the thumb, Replay starts at hour 0.
  // ══════════════════════════════════════════════════════════════
  const SPEED_SEC_PER_HOUR = { slow: 2, normal: 1, fast: 0.35 };
  const speedSelect = document.getElementById('speedSelect');
  const playBtn = document.getElementById('playBtn');
  const replayBtn = document.getElementById('replayBtn');
  let playRaf = null;
  let onPlaybackDone = null;

  function stopPlayback() {
    if (playRaf) { cancelAnimationFrame(playRaf); playRaf = null; }
    playBtn.textContent = '▶ Play';
  }
  function startPlayback(onDone) {
    stopPlayback();
    const f = activeForecast();
    if (!f) return;
    onPlaybackDone = onDone || null;
    const total = SM.forecastTotalHours(f);
    if (playbackHour >= total - 1e-9) playbackHour = 0;
    let last = performance.now(), skipFrame = false;
    playBtn.textContent = '⏸ Pause';
    const tick = now => {
      const secPerHour = SPEED_SEC_PER_HOUR[speedSelect.value] || 1;
      playbackHour = Math.min(total, playbackHour + Math.max(0, now - last) / 1000 / secPerHour);
      last = now;
      // Performance level 2+: redraw the graph and scene every other frame
      // (30 Hz). Time still advances every frame, so speed is unchanged.
      skipFrame = perfLevel >= 2 && !skipFrame && playbackHour < total;
      if (skipFrame) { playRaf = requestAnimationFrame(tick); return; }
      seek(playbackHour);
      if (playbackHour >= total) { stopPlayback(); if (onPlaybackDone) onPlaybackDone(); return; }
      playRaf = requestAnimationFrame(tick);
    };
    playRaf = requestAnimationFrame(tick);
  }
  playBtn.onclick = () => { clearAutoplay(); if (playRaf) stopPlayback(); else startPlayback(); };
  replayBtn.onclick = () => { clearAutoplay(); stopPlayback(); playbackHour = 0; seek(0); startPlayback(); };

  // ── Autoplay after a pick (1A.3, Section 1b) ──
  // The chosen graph slides over (OVERLAY_SLIDE_MS), then after a short
  // beat the trace plays by itself at Fast. The slider and Replay stay for
  // looking again. Autoplay still runs with reduced motion (it is the graph
  // and the snow level moving; there are just no flakes or birds).
  const AUTOPLAY_BEAT_MS = 500;
  let autoplayTimer = null;
  function clearAutoplay() { if (autoplayTimer) { clearTimeout(autoplayTimer); autoplayTimer = null; } }
  function scheduleAutoplay(delay) {
    clearAutoplay();
    autoplayTimer = setTimeout(() => {
      autoplayTimer = null;
      speedSelect.value = 'fast';
      playbackHour = 0;
      startPlayback();
    }, delay);
  }

  // ══════════════════════════════════════════════════════════════
  // HOVER AND PIN (1A.3, Section 5; spec 4b)
  // Hover snaps to the nearest whole hour on the line. Hovering moves the
  // scene (and the slider thumb) to that hour; leaving puts it back. Click
  // pins a point with its coordinates; click it again to unpin. A tap on a
  // touch screen hovers and pins in one step. Ignored while playing.
  // ══════════════════════════════════════════════════════════════
  let ovHover = null, ovPins = [];
  // Which graph can be hovered now: { kind: 'chart' | 'overlay', f }.
  function hoverTarget() {
    if (mode === 'explorer') return { kind: 'chart', f: currentExplorerForecast() };
    if (mode === 'match') return currentMatchItem && matchPhase !== 'pick' ? { kind: 'overlay', f: currentMatchItem.correct } : null;
    return null;
  }
  function redrawPins() { chart.update('none'); drawOverlayPins(); }
  function clearPins() { pins = []; hoverPt = null; ovPins = []; ovHover = null; if (typeof chart !== 'undefined') redrawPins(); }
  function togglePinAt(h) {
    const tg = hoverTarget();
    if (!tg) return;
    h = SM.snapHour(h, SM.forecastTotalHours(tg.f));
    const list = tg.kind === 'chart' ? pins : ovPins;
    const k = list.findIndex(p => p.t === h);
    if (k >= 0) list.splice(k, 1); else list.push({ t: h, d: SM.depthAt(tg.f, h) });
    redrawPins();
  }
  function hoverAt(h) {
    const tg = hoverTarget();
    if (!tg || playRaf) return;
    h = SM.snapHour(h, SM.forecastTotalHours(tg.f));
    const pt = { t: h, d: SM.depthAt(tg.f, h) };
    if (tg.kind === 'chart') { if (hoverPt && hoverPt.t === h) return; hoverPt = pt; } else { if (ovHover && ovHover.t === h) return; ovHover = pt; }
    // The scene (and the thumb) jump to that hour.
    const f = activeForecast();
    if (f) {
      const hh = Math.min(h, SM.forecastTotalHours(f));
      const d = setScene(f, hh);
      updateLinkLine(linkLineOn() ? d : null, hh);
      if (!timeSlider.disabled) { timeSlider.value = hh; timeSlider.style.setProperty('--pct', (timelineTotal ? hh / timelineTotal * 100 : 0) + '%'); hourReadout.textContent = formatHour(hh); }
      markStoryPiece(tracedStoryEl(), f, hh);
    } else if (hoverPreviewForecast()) {
      // Before an answer: the snow depth only, no weather (leak rule).
      setScene(hoverPreviewForecast(), h, { neutral: true });
    }
    redrawPins();
  }
  function hoverEnd() {
    if (!hoverPt && !ovHover) return;
    hoverPt = null; ovHover = null;
    const f = activeForecast();
    if (f) seek(playbackHour);
    else if (hoverPreviewForecast()) setScene(hoverPreviewForecast(), 0, { neutral: true });
    redrawPins();
  }
  // The forecast a hover may preview as depth-only before an answer.
  function hoverPreviewForecast() { return null; }

  // Chart: pixel -> hour.
  const chartCanvas = document.getElementById('chart');
  function chartHourAt(e) {
    const r = chartCanvas.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    const a = chart.chartArea;
    if (x < a.left - 8 || x > a.right + 8 || y < a.top - 8 || y > a.bottom + 8) return null;
    return chart.scales.x.getValueForPixel(x);
  }
  chartCanvas.addEventListener('pointermove', e => {
    if (e.pointerType === 'touch') return;
    const tg = hoverTarget();
    if (!tg || tg.kind !== 'chart') return;
    const h = chartHourAt(e);
    if (h == null) hoverEnd(); else hoverAt(h);
  });
  chartCanvas.addEventListener('pointerleave', hoverEnd);
  chartCanvas.addEventListener('pointerdown', e => {
    const tg = hoverTarget();
    if (!tg || tg.kind !== 'chart' || e.pointerType !== 'touch') return;
    const h = chartHourAt(e);
    if (h != null) hoverAt(h); // a tap hovers; the click that follows pins
  });
  chartCanvas.addEventListener('click', e => {
    const tg = hoverTarget();
    if (!tg || tg.kind !== 'chart') return;
    const h = chartHourAt(e);
    if (h != null) togglePinAt(h);
  });
  // Overlay on the scene's measuring inset (Match, after the pick).
  function overlayHourAt(e) {
    if (!L || !el.ovHit || e.target !== el.ovHit) return null;
    const r = sceneSvg.getBoundingClientRect();
    return (e.clientX - r.left - el.ovX0) / L.pxPerInch;
  }
  sceneSvg.addEventListener('pointermove', e => {
    const tg = hoverTarget();
    if (!tg || tg.kind !== 'overlay') return;
    const h = overlayHourAt(e);
    if (h == null) hoverEnd(); else if (e.pointerType !== 'touch') hoverAt(h);
  });
  sceneSvg.addEventListener('pointerleave', () => { if (ovHover) hoverEnd(); });
  sceneSvg.addEventListener('pointerdown', e => {
    const tg = hoverTarget();
    if (!tg || tg.kind !== 'overlay' || e.pointerType !== 'touch') return;
    const h = overlayHourAt(e);
    if (h != null) hoverAt(h);
  });
  sceneSvg.addEventListener('click', e => {
    const tg = hoverTarget();
    if (!tg || tg.kind !== 'overlay') return;
    const h = overlayHourAt(e);
    if (h != null) togglePinAt(h);
  });

  // ══════════════════════════════════════════════════════════════
  // MATCH THE FORECAST
  // ══════════════════════════════════════════════════════════════
  const challengeStory = document.getElementById('challengeStory'); // the story above the answer area
  const matchBox = document.getElementById('matchBox');
  const matchTiles = document.getElementById('matchTiles');
  const matchChoicesEl = document.getElementById('matchChoices');
  const nextItemBtn = document.getElementById('nextItemBtn');
  const showResultBtn = document.getElementById('showResultBtn');
  let currentMatchItem = null;

  // Small choice graph: MAX_HOURS x MAX_DEPTH units, every unit MG.U wide
  // AND tall (unit squares). Margins hold the tick numbers (trimmed in
  // 1A.3 so the tiles can be bigger with the story above them).
  const MG = { U: 16, L: 24, R: 5, T: 8, B: 20 };
  const MG_W = MG.L + SM.MAX_HOURS * MG.U + MG.R, MG_H = MG.T + SM.MAX_DEPTH * MG.U + MG.B;
  function miniGraphSvg(points) {
    const sx = x => MG.L + x * MG.U;
    const sy = y => MG.T + (SM.MAX_DEPTH - y) * MG.U;
    const xl = new Set(SM.axisLabels(SM.MAX_HOURS)), yl = new Set(SM.axisLabels(SM.MAX_DEPTH));
    let grid = '';
    for (let v = 0; v <= SM.MAX_HOURS; v++) {
      grid += `<line x1="${sx(v)}" y1="${sy(0)}" x2="${sx(v)}" y2="${sy(SM.MAX_DEPTH)}" stroke="var(--muted)" stroke-width="0.7" opacity="${xl.has(v) ? 0.55 : 0.24}"/>`;
      if (xl.has(v)) grid += `<text x="${sx(v)}" y="${sy(0) + 15}" text-anchor="middle" font-family="Space Mono" font-size="12" fill="var(--muted)">${v}</text>`;
    }
    for (let v = 0; v <= SM.MAX_DEPTH; v++) {
      grid += `<line x1="${sx(0)}" y1="${sy(v)}" x2="${sx(SM.MAX_HOURS)}" y2="${sy(v)}" stroke="var(--muted)" stroke-width="0.7" opacity="${yl.has(v) ? 0.55 : 0.24}"/>`;
      if (yl.has(v)) grid += `<text x="${MG.L - 4}" y="${sy(v) + 4.5}" text-anchor="end" font-family="Space Mono" font-size="12" fill="var(--muted)">${v}</text>`;
    }
    const path = points.map((p, i) => (i ? 'L' : 'M') + sx(p.t) + ',' + sy(p.d)).join(' ');
    return `<svg viewBox="0 0 ${MG_W} ${MG_H}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${grid}
      <path d="${path}" fill="none" stroke="var(--text)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
  }

  // Lay out the four choices as 1x4 or 2x2 — whichever gives the bigger
  // grid cells in the space available (?tile= forces one). After the pick
  // they shrink to a strip (MATCH_STRIP_H tall) and the verdict panel
  // takes the space they used.
  const CHOICE_CHROME = 12; // 4px padding + 2px border, each side
  const MATCH_STRIP_H = 118;
  function layoutMatchChoices() {
    const compact = matchBox.classList.contains('compact');
    const box = (compact ? matchBox : matchTiles).getBoundingClientRect();
    if (!box.width || !box.height) return;
    const gap = 12;
    const H = compact ? MATCH_STRIP_H : box.height;
    const fits = [{ cols: 4, rows: 1, name: '1x4' }, { cols: 2, rows: 2, name: '2x2' }].map(c => {
      const cw = (box.width - gap * (c.cols - 1)) / c.cols, ch = (H - gap * (c.rows - 1)) / c.rows;
      const s = Math.min((cw - CHOICE_CHROME) / MG_W, (ch - CHOICE_CHROME) / MG_H);
      return Object.assign(c, { s, cellPx: s * MG.U });
    });
    const forced = fits.find(c => c.name === URLP.tile);
    const pick = compact ? fits[0] : (forced || (fits[0].s >= fits[1].s ? fits[0] : fits[1]));
    matchChoicesEl.style.gridTemplateColumns = `repeat(${pick.cols}, ${(MG_W * pick.s + CHOICE_CHROME).toFixed(1)}px)`;
    matchChoicesEl.style.gridTemplateRows = `repeat(${pick.rows}, ${(MG_H * pick.s + CHOICE_CHROME).toFixed(1)}px)`;
    if (compact) return;
    matchChoicesEl.dataset.layout = pick.name;
    matchChoicesEl.dataset.cellPx = pick.cellPx.toFixed(1);
    matchChoicesEl.dataset.cellPx2x2 = fits[1].cellPx.toFixed(1);
    matchChoicesEl.dataset.cellPx1x4 = fits[0].cellPx.toFixed(1);
  }
  new ResizeObserver(layoutMatchChoices).observe(matchTiles);
  new ResizeObserver(layoutMatchChoices).observe(matchBox);

  function setPlaybackEnabled(on) { playBtn.disabled = !on; replayBtn.disabled = !on; }

  // ── Match round state (1A.2 Section 2, 1A.3 Section 1b) ──
  //   'pick'    — choose a graph; nothing about the true forecast shows.
  //   'reveal'  — the pick is locked in (and scored), the chosen graph sits
  //               on the scene, and the true path traces itself (autoplay).
  //   'verdict' — right/wrong and the difference panel, chips update, Next.
  let matchPhase = 'pick';
  let pickResult = null;   // recordAttempt() result, shown at the verdict
  let pickedIndex = null;
  let seedPending = URLP.seed != null;
  const OVERLAY_SLIDE_MS = 400;

  function resetChallengeChrome() {
    stopPlayback();
    clearAutoplay();
    clearPins();
    setPlaybackEnabled(false);
    verdictPanel.classList.add('hidden');
    verdictPanel.classList.remove('is-right', 'is-wrong');
    nextItemBtn.classList.add('hidden');
    showResultBtn.classList.add('hidden');
    document.getElementById('checkBtn').classList.add('hidden');
  }

  function newMatchItem() {
    resetChallengeChrome();
    matchPhase = 'pick';
    pickResult = null; pickedIndex = null;
    scene.overlay = null;
    matchBox.classList.remove('compact');

    let item = null, roundSeed = 0;
    // ?seed=N makes the FIRST round reproducible; "Next" is random after that.
    const seed = seedPending ? URLP.seed : null;
    seedPending = false;
    for (let tries = 0; tries < 40 && !item; tries++) {
      roundSeed = (seed != null ? seed * 101 + tries : (Date.now() ^ (Math.random() * 1e9) ^ tries)) >>> 0;
      const rng = SM.makeRng(roundSeed);
      const forecast = SM.generateForecast(rng, { numSegments: currentLevel() });
      const key = SM.pointsKey(SM.forecastPoints(forecast));
      if (seed == null && SM.wasLastItem(key, 'match')) continue;
      item = SM.buildMatchItem(rng, forecast, 3);
      if (item) SM.rememberLastItem(key, 'match');
    }
    if (!item) { challengeStory.textContent = 'Could not build a round — try again.'; return; }
    currentMatchItem = item;
    // The story stays plain until the pick (colors would hint at the pieces).
    renderStory(challengeStory, item.correct, false);
    // Day or night, tied to the round's seed (?scene= forces it).
    scene.type = URLP.scene || SM.sceneTypeFor(roundSeed);
    // Leak rule: before a pick the scene shows the story's true starting
    // depth at hour 0 with no weather, and the slider is locked.
    playbackHour = 0;
    setScene(item.correct, 0, { neutral: true });
    setTimeline(SM.forecastTotalHours(item.correct), true);
    matchChoicesEl.innerHTML = '';
    item.choices.forEach((choice, i) => {
      const div = document.createElement('div');
      div.className = 'match-choice';
      div.tabIndex = 0;
      div.setAttribute('role', 'button');
      div.setAttribute('aria-label', `Graph ${i + 1}`);
      div.innerHTML = miniGraphSvg(choice.points);
      div.onclick = () => pickMatchChoice(i, div);
      div.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pickMatchChoice(i, div); } };
      matchChoicesEl.appendChild(div);
    });
    layoutMatchChoices();
  }

  function pickMatchChoice(i, card) {
    if (matchPhase !== 'pick') return;
    const choice = currentMatchItem.choices[i];
    const truth = currentMatchItem.correct;
    // The pick locks in and is scored now (first try, one score per
    // round), but the streak bar only changes at the verdict.
    pickResult = SM.recordAttempt(choice.isCorrect, 'match');
    pickedIndex = i;
    matchPhase = 'reveal';
    const from = card.getBoundingClientRect(); // before the tiles shrink
    Array.from(matchChoicesEl.children).forEach((c, j) => {
      c.classList.add(j === i ? 'your-pick' : 'dimmed');
      c.classList.add('resolved');
      c.tabIndex = -1;
    });
    // The tiles shrink to a strip; the panel takes the space.
    matchBox.classList.add('compact');
    layoutMatchChoices();
    showPendingPanel('Your pick is in.', 'The colored line traces what the story really did. Watch whether it follows your graph.');
    // The story takes its piece colors now.
    challengeStory.classList.add('colored');
    scene.overlay = { chosen: choice, truth, diff: SM.describeDifference(choice.forecast, truth), revealAll: false };
    slideCardToScene(card, from);
    setPlaybackEnabled(true);
    setTimeline(SM.forecastTotalHours(truth), false);
    playbackHour = 0;
    seek(0);
    showResultBtn.classList.remove('hidden');
    scheduleAutoplay((prefersReducedMotion ? 0 : OVERLAY_SLIDE_MS) + AUTOPLAY_BEAT_MS);
  }

  // A copy of the chosen card glides from the grid to where the overlay
  // sits on the scene, then fades as the overlay takes its place.
  function slideCardToScene(card, from) {
    if (!L || !el.ov) return;
    if (prefersReducedMotion) return;
    const svgRect = sceneSvg.getBoundingClientRect();
    const I = L.inset;
    const to = { left: svgRect.left + I.x, top: svgRect.top + I.y, width: I.w, height: I.h };
    const ghost = card.cloneNode(true);
    ghost.classList.remove('dimmed', 'your-pick');
    ghost.classList.add('match-ghost');
    Object.assign(ghost.style, { left: from.left + 'px', top: from.top + 'px', width: from.width + 'px', height: from.height + 'px' });
    document.body.appendChild(ghost);
    el.ov.style.opacity = '0';
    const anim = ghost.animate([
      { transform: 'translate(0,0) scale(1,1)', opacity: 1 },
      { transform: `translate(${to.left - from.left}px, ${to.top - from.top}px) scale(${to.width / from.width}, ${to.height / from.height})`, opacity: 0.15 },
    ], { duration: OVERLAY_SLIDE_MS, easing: 'cubic-bezier(.3,.7,.3,1)', fill: 'forwards' });
    anim.onfinish = () => { ghost.remove(); el.ov.style.transition = 'opacity 150ms'; el.ov.style.opacity = '1'; };
  }

  // The verdict: when the trace reaches the end, or on "Show result".
  function showVerdict() {
    if (matchPhase !== 'reveal') return;
    matchPhase = 'verdict';
    const choice = currentMatchItem.choices[pickedIndex];
    const card = matchChoicesEl.children[pickedIndex];
    card.classList.remove('your-pick');
    card.classList.add(choice.isCorrect ? 'correct-pick' : 'wrong-pick');
    if (!choice.isCorrect) {
      const right = currentMatchItem.choices.findIndex(c => c.isCorrect);
      matchChoicesEl.children[right].classList.remove('dimmed');
      matchChoicesEl.children[right].classList.add('correct-pick', 'answer-was');
    }
    scene.overlay.revealAll = true;
    applyScene();
    refreshScoreDisplay();
    showVerdictPanel({
      right: choice.isCorrect,
      title: choice.isCorrect ? 'Right!' : 'Not quite.',
      sentence: choice.isCorrect ? 'The snow followed your graph all the way. Each color is one part of the story.' : (SM.RULE_FEEDBACK[choice.rule] || SM.differenceSentence(scene.overlay.diff)),
      diff: choice.isCorrect ? null : scene.overlay.diff,
      who: { mine: 'Your graph', truth: 'The story' },
      result: pickResult,
    });
    showResultBtn.classList.add('hidden');
    nextItemBtn.classList.remove('hidden');
  }
  showResultBtn.onclick = () => { clearAutoplay(); stopPlayback(); if (mode === 'match') showVerdict(); };
  nextItemBtn.onclick = () => { if (mode === 'match') newMatchItem(); };

  // ══════════════════════════════════════════════════════════════
  // THE DIFFERENCE PANEL (1A.3, Section 3) — shared by the challenges.
  // Right: a short confirmation. Wrong: the first piece that differs, as
  // two small rise/run staircases (slope / shape), both starting depths
  // (start), or where each version's piece ends (length), plus one plain
  // sentence naming the mistake.
  // ══════════════════════════════════════════════════════════════
  function showPendingPanel(title, note) {
    verdictPanel.classList.remove('hidden', 'is-right', 'is-wrong');
    verdictPanel.innerHTML = `<div class="vp-head"><span>${title}</span></div><p class="vp-note">${note}</p>`;
  }
  const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  // A small staircase: the piece's line over one step, run leg (blue)
  // along the bottom and rise leg (orange) up the side, labeled.
  function staircaseSvg(p, lineColor, unit) {
    const run = p.run, rise = p.rise, up = Math.abs(rise);
    const runLbl = `${run} ${run === 1 ? 'hour' : 'hours'}`;
    const riseLbl = `${rise > 0 ? '+' : rise < 0 ? '−' : ''}${up} ${up === 1 ? 'inch' : 'inches'}`;
    const pad = { l: 8, r: up ? 14 + riseLbl.length * 9.9 : 8, t: 10, b: 30 };
    const w = Math.max(pad.l + run * unit + pad.r, runLbl.length * 9.9 + 16), h = pad.t + up * unit + pad.b;
    const x0 = pad.l, yBase = rise >= 0 ? pad.t + up * unit : pad.t;
    const y1 = rise >= 0 ? pad.t : pad.t + up * unit;
    const x1 = x0 + run * unit;
    let g = '';
    for (let i = 0; i <= run; i++) g += `<line x1="${x0 + i * unit}" x2="${x0 + i * unit}" y1="${pad.t}" y2="${pad.t + up * unit}" stroke="var(--border)" stroke-width="1"/>`;
    for (let j = 0; j <= up; j++) g += `<line x1="${x0}" x2="${x1}" y1="${pad.t + j * unit}" y2="${pad.t + j * unit}" stroke="var(--border)" stroke-width="1"/>`;
    const blue = getTheme() === 'light' ? runBlue : '#6f9bff';
    return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true">${g}
      <line x1="${x0}" y1="${yBase}" x2="${x1}" y2="${yBase}" stroke="${runBlue}" stroke-width="3" stroke-dasharray="6 3"/>
      ${up ? `<line x1="${x1}" y1="${yBase}" x2="${x1}" y2="${y1}" stroke="${riseOrange}" stroke-width="3" stroke-dasharray="6 3"/>` : ''}
      <line x1="${x0}" y1="${yBase}" x2="${x1}" y2="${y1}" stroke="${lineColor}" stroke-width="3.5" stroke-linecap="round"/>
      <text x="${(x0 + x1) / 2}" y="${(rise >= 0 ? yBase : yBase) + 22}" text-anchor="middle" font-family="Space Mono" font-weight="700" font-size="16" fill="${blue}">${runLbl}</text>
      ${up ? `<text x="${x1 + 6}" y="${(yBase + y1) / 2 + 5}" font-family="Space Mono" font-weight="700" font-size="16" fill="${riseOrange}">${riseLbl}</text>` : ''}
    </svg>`;
  }
  // Starting depth: a little 0..MAX_DEPTH axis with one dot.
  function startSvg(v, color) {
    const H = 120, k = H / SM.MAX_DEPTH, y = 8 + (SM.MAX_DEPTH - v) * k;
    let ticks = '';
    for (const lab of SM.axisLabels(SM.MAX_DEPTH)) ticks += `<text x="26" y="${8 + (SM.MAX_DEPTH - lab) * k + 5}" text-anchor="end" font-family="Space Mono" font-size="13" fill="var(--muted)">${lab}</text>`;
    return `<svg viewBox="0 0 64 ${H + 16}" width="64" height="${H + 16}" aria-hidden="true">${ticks}
      <line x1="34" x2="34" y1="8" y2="${8 + H}" stroke="var(--muted)" stroke-width="2"/>
      <circle cx="34" cy="${y}" r="7" fill="${color}" stroke="var(--surface)" stroke-width="2"/></svg>`;
  }
  // Piece length: a 0..MAX_HOURS time bar with that piece's span.
  function lengthSvg(p, color) {
    const W = 200, k = W / SM.MAX_HOURS;
    let ticks = '';
    for (const lab of SM.axisLabels(SM.MAX_HOURS)) ticks += `<text x="${10 + lab * k}" y="56" text-anchor="middle" font-family="Space Mono" font-size="15" fill="var(--muted)">${lab}</text>`;
    for (let hr = 0; hr <= SM.MAX_HOURS; hr++) ticks += `<line x1="${10 + hr * k}" x2="${10 + hr * k}" y1="18" y2="34" stroke="var(--border)" stroke-width="1"/>`;
    return `<svg viewBox="0 0 ${W + 20} 62" width="${W + 20}" height="62" aria-hidden="true">${ticks}
      <line x1="10" x2="${10 + W}" y1="26" y2="26" stroke="var(--border)" stroke-width="5" stroke-linecap="round"/>
      <line x1="${10 + p.t0 * k}" x2="${10 + p.end * k}" y1="26" y2="26" stroke="${color}" stroke-width="10" stroke-linecap="round"/>
      <circle cx="${10 + p.end * k}" cy="26" r="7" fill="${color}" stroke="var(--surface)" stroke-width="2"/></svg>`;
  }
  function showVerdictPanel({ right, title, sentence, diff, who, result }) {
    verdictPanel.classList.remove('hidden', 'is-right', 'is-wrong');
    verdictPanel.classList.add(right ? 'is-right' : 'is-wrong');
    let html = `<div class="vp-head"><span class="vp-icon" aria-hidden="true">${right ? '✓' : '✗'}</span><span>${esc(title)}</span></div>`;
    if (sentence) html += `<p>${esc(sentence)}</p>`;
    if (diff) {
      const lines = SM.differenceLines(diff, who);
      const truthColor = cssVar(`--piece-${((diff.pieceIndex || 0) % 3) + 1}`);
      const ink = 'var(--text)';
      let figs;
      if (diff.kind === 'start') figs = [startSvg(diff.mine.start, ink), startSvg(diff.truth.start, truthColor)];
      else if (diff.kind === 'length') figs = [lengthSvg(diff.mine, ink), lengthSvg(diff.truth, truthColor)];
      else {
        const unit = Math.max(10, Math.min(28, 104 / Math.max(diff.mine.run, diff.truth.run, Math.abs(diff.mine.rise), Math.abs(diff.truth.rise), 1)));
        figs = [staircaseSvg(diff.mine, ink, unit), staircaseSvg(diff.truth, truthColor, unit)];
      }
      const where = diff.kind === 'start' ? 'At hour 0' : `Piece ${diff.pieceIndex + 1} (from hour ${SM.formatMixed(diff.hour)})`;
      html += `<div class="vp-sides">
        <div class="vp-side">${figs[0]}<p><b>${esc(who.mine)}</b>${esc(lines[0].replace(who.mine + ': ', '').replace(who.mine + ' ', ''))}</p></div>
        <div class="vp-side">${figs[1]}<p><b>${esc(who.truth)}</b>${esc(lines[1].replace(who.truth + ': ', '').replace(who.truth + ' ', ''))}</p></div>
      </div><p class="vp-note">${esc(where)} is where they first differ.</p>`;
    }
    const r = result;
    let extra = '';
    if (r && r.earnedNewMedal) extra += ` New medal: ${MEDAL_NAMES[r.newMedal]}!`;
    if (r && r.leveledUp) extra += ` Level up! Next forecasts have ${currentLevel()} pieces.`;
    else if (r && right && currentLevel() < SM.MAX_LEVEL) extra += ` ${SM.LEVEL_UP_STREAK - SM.getScoreState(mode).levelProgress} more in a row for Level ${currentLevel() + 1}.`;
    if (extra) html += `<p class="vp-note">${esc(extra.trim())}</p>`;
    verdictPanel.innerHTML = html;
  }

  // ── init ──
  applyTheme(getTheme());
  if (URLP.start != null || URLP.segs) {
    const candidate = {
      start: URLP.start != null ? URLP.start : explorerStart,
      segments: URLP.segs ? URLP.segs.slice(0, SM.MAX_SEGMENTS) : explorerSegments,
    };
    const problem = SM.checkForecast(candidate);
    if (!problem) { explorerStart = candidate.start; explorerSegments = candidate.segments; }
    else console.warn('Snow Challenge: ignoring an Explorer forecast in the URL that breaks the limits —', problem);
  }
  if (URLP.steps) toggleSteps.checked = true;
  if (URLP.story) toggleStory.checked = true;
  buildScene();
  renderSegmentRows();
  setMode(CHALLENGES.includes(URLP.mode) ? URLP.mode : 'explorer');
  if (mode === 'explorer' && URLP.at) {
    const total = SM.forecastTotalHours(currentExplorerForecast());
    seek(URLP.at === 'end' ? total : Math.max(0, Math.min(total, +URLP.at || 0)));
  }
  // Deep link into a Match reveal (for review): ?pick=…&reveal=…
  //   pick = right | wrong | 0-3 | slope | start | length | shape (a wrong
  //   graph whose first difference is that kind; the seed is searched
  //   forward until a round has one). reveal = picked | mid | end; any
  //   reveal stops the autoplay so the picture holds still.
  if (mode === 'match' && URLP.pick && currentMatchItem) {
    const KINDS = ['slope', 'start', 'length', 'shape'];
    const kindIdx = () => currentMatchItem.choices.findIndex(c => !c.isCorrect && (SM.describeDifference(c.forecast, currentMatchItem.correct) || {}).kind === URLP.pick);
    if (KINDS.includes(URLP.pick)) {
      for (let k = 0; k < 60 && kindIdx() < 0; k++) { seedPending = true; URLP.seed = (URLP.seed || 1) + 1; newMatchItem(); }
    }
    const ch = currentMatchItem.choices;
    let idx = /^[0-3]$/.test(URLP.pick) ? +URLP.pick : -1;
    if (URLP.pick === 'right') idx = ch.findIndex(c => c.isCorrect);
    if (KINDS.includes(URLP.pick)) idx = kindIdx();
    if (URLP.pick === 'wrong') {
      // the wrong graph that stays on the snow's path longest, so the split shows mid-trace
      idx = ch.map((c, i) => i).filter(i => !ch[i].isCorrect)
        .map(i => ({ i, at: (SM.firstSplit(currentMatchItem.correct, ch[i].forecast) || { hour: 0 }).hour }))
        .sort((a, b) => b.at - a.at)[0].i;
    }
    if (idx >= 0) {
      pickMatchChoice(idx, matchChoicesEl.children[idx]);
      const total = SM.forecastTotalHours(currentMatchItem.correct);
      const dff = scene.overlay && scene.overlay.diff;
      if (URLP.reveal) clearAutoplay();
      if (URLP.reveal === 'mid') seek(dff ? Math.min(total - 0.25, dff.hour + 1.5) : total / 2);
      else if (URLP.reveal === 'end') seek(total);
    }
  }
  if (URLP.pins) URLP.pins.forEach(h => togglePinAt(h));
  requestAnimationFrame(refreshLinkLine);
})();
</script>
</body>
</html>
