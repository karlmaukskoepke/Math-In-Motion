<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snow Challenge — GraFables</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="snowModel.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg:        #0f1117;
      --surface:   #1a1d27;
      --surface2:  #22263a;
      --accent:    #00e5ff;
      --accent2:   #ff4081;
      --accent3:   #69f0ae;
      --accent4:   #ffd740;
      --text:      #e8eaf6;
      --muted:     #7986cb;
      --border:    #2e3356;
      /* Karl's class conventions for this challenge specifically (spec
         section 2) — distinct from the site's general accent palette
         above, which is why they're their own variables. */
      --run-blue:  #1A56DB;
      --rise-orange: #E07B00;
      /* Graph scale in units (hours across, inches up). Set from
         snowModel.js at startup so the plot keeps unit squares. */
      --hours: 12;
      --depth: 15;
      /* Snow fill under a traced graph (Phase 1A.2, Section 3). Translucent
         so the gridlines show through. */
      --snow-fill: rgba(232, 240, 255, 0.5);
      --snow-edge: #ffffff;
      /* Piece colors (1A.3, Section 2) are set from SnowModel.PIECE_COLORS
         at startup and on theme change: ONE place to change them. */
      --piece-1: #6fe0d0; --piece-2: #e86ce8; --piece-3: #d4b04a;
      /* Medals: metallic gradients. Gold is a deep amber so it never reads
         as Snow's yellow identity color. */
      --metal-bronze: linear-gradient(160deg, #f0b98a 0%, #c27a43 38%, #8c4f25 62%, #d99a66 100%);
      --metal-silver: linear-gradient(160deg, #ffffff 0%, #c9d1dc 35%, #8e98a6 62%, #e3e8ee 100%);
      --metal-gold:   linear-gradient(160deg, #fff0b0 0%, #e0a92a 35%, #a86c08 62%, #f2c65a 100%);
      --flame: #ff8a3d;
    }
    html[data-theme="light"] {
      --bg:        #f4f5fa;
      --surface:   #ffffff;
      --surface2:  #eceef7;
      --accent:    #0077b6;
      --accent2:   #c2185b;
      --accent3:   #2e7d32;
      --accent4:   #e0982a;
      --text:      #1a1d27;
      --muted:     #5c6bc0;
      --border:    #d0d3e6;
      /* pure white vanishes on the light page: ice-blue with a blue-gray edge */
      --snow-fill: rgba(150, 190, 232, 0.45);
      --snow-edge: #6f86a8;
    }
    body { transition: background 0.2s, color 0.2s; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; }
    #app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; position: relative; }

    /* ── HEADER ── */
    #header {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 14px; background: var(--surface);
      border-bottom: 2px solid var(--accent4); flex-shrink: 0; z-index: 10;
    }
    #header h1 { font-family: 'Space Mono', monospace; font-size: 0.82rem; color: var(--accent4); letter-spacing: 2px; text-transform: uppercase; flex: 1; }
    .hdr-btn {
      background: none; border: 1px solid var(--border); color: var(--muted);
      border-radius: 7px; padding: 5px 12px; font-size: 0.72rem; font-family: 'Space Mono', monospace;
      cursor: pointer; display: flex; align-items: center; gap: 5px;
      transition: all 0.15s; flex-shrink: 0; letter-spacing: 0.5px; text-decoration: none;
    }
    .hdr-btn:hover { border-color: var(--accent4); color: var(--accent4); }
    .hdr-btn.active { border-color: var(--accent4); color: var(--accent4); background: rgba(255,215,64,0.08); }
    .hdr-btn:focus-visible, .play-btn:focus-visible, .seg-remove:focus-visible, #addSegmentBtn:focus-visible { outline: 2px solid var(--accent4); outline-offset: 2px; }
    /* ── MODE BUTTONS with medals (1A.3, Section 4) ──
       Active mode = bold label + underline (never yellow, so it can't be
       mistaken for a gold medal). Each challenge button takes its best
       medal: outline -> bronze -> silver -> gold, metallic with a shine. */
    #modeNav { display: flex; gap: 6px; align-items: center; }
    .mode-btn { position: relative; overflow: hidden; font-size: 0.74rem; padding: 6px 12px; color: var(--text); }
    .mode-btn.active { font-weight: 700; border-color: var(--text); }
    .mode-btn.active::before { content: ''; position: absolute; left: 10px; right: 10px; bottom: 2px; height: 2px; border-radius: 1px; background: currentColor; }
    .mode-btn:hover { color: var(--text); border-color: var(--text); }
    .mode-btn.medal-bronze, .mode-btn.medal-silver, .mode-btn.medal-gold { color: #1a1206; border-color: transparent; text-shadow: 0 1px 0 rgba(255,255,255,0.35); }
    .mode-btn.medal-bronze { background: var(--metal-bronze); }
    .mode-btn.medal-silver { background: var(--metal-silver); color: #15181f; }
    .mode-btn.medal-gold   { background: var(--metal-gold); }
    .mode-btn.medal-bronze::after, .mode-btn.medal-silver::after, .mode-btn.medal-gold::after, .medal-mark.earned .medal-coin::after {
      content: ''; position: absolute; top: -40%; bottom: -40%; width: 38%; left: -60%;
      background: linear-gradient(100deg, transparent, rgba(255,255,255,0.55), transparent);
      transform: skewX(-18deg); animation: metalShine 5s ease-in-out infinite; pointer-events: none;
    }
    @keyframes metalShine { 0%, 70% { left: -60%; } 100% { left: 130%; } }

    /* ── CONTENT ── */    /* ── CONTENT ── */
    #content { display: flex; flex: 1; overflow: hidden; position: relative; }
    /* Graph + controls on the LEFT, the scene (and the story above it) on the RIGHT. */
    #graphPane { flex: 1; display: flex; flex-direction: column; padding: 14px 18px; gap: 12px; overflow: hidden; min-width: 0; }
    #mainRow { display: flex; gap: 16px; flex: 1; min-height: 0; }
    /* Which parts show in which mode (#app[data-mode]). */
    #controlsCol, #matchBox, #sideCol, #challengeStory, #streakBar { display: none; }
    #app[data-mode="explorer"] #controlsCol { display: flex; }
    #app[data-mode="match"] #matchBox { display: flex; }
    #app[data-mode="story"] #sideCol, #app[data-mode="draw"] #sideCol { display: flex; }
    #app[data-mode="match"] #challengeStory, #app[data-mode="draw"] #challengeStory { display: block; }
    #app:not([data-mode="explorer"]) #streakBar { display: flex; }
    #app[data-mode="match"] #chartBox { display: none; }
    /* In the challenges the story moves to the left pane, so the scene
       pane narrows and the left pane gets the width (1A.3, Section 1a). */
    #app:not([data-mode="explorer"]) #scenePane { width: clamp(340px, 33vw, 450px); }
    #app:not([data-mode="explorer"]) #storyText { display: none; }
    #scenePane {
      width: clamp(360px, 38vw, 560px); transition: width 0s; flex-shrink: 0; background: var(--surface);
      border-left: 1px solid var(--border); display: flex; flex-direction: column;
      padding: 14px; gap: 10px; overflow: hidden;
    }
    .story-banner {
      font-size: clamp(1.05rem, 1.55vw, 1.5rem); font-weight: 600; line-height: 1.38; color: var(--text);
      background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px;
    }
    .story-banner.hidden { display: none !important; }
    /* Story in the challenges: above the answer area, ~1.4x the old size. */
    .challenge-story { font-size: clamp(1.15rem, 2.17vw, 1.85rem); line-height: 1.3; font-weight: 500; flex-shrink: 0; padding: 12px 16px; }
    /* Colored story (1A.3, Section 2): each piece's sentence in its piece
       color and BOLD (so it still reads in grayscale); the starting-depth
       sentence stays plain. While a trace plays, the piece the dot is in
       is underlined and the others soften. */
    .story-piece { transition: opacity 0.2s, color 0.2s; }
    .colored .story-piece { font-weight: 800; }
    .colored .story-piece[data-piece="0"] { color: var(--piece-1); }
    .colored .story-piece[data-piece="1"] { color: var(--piece-2); }
    .colored .story-piece[data-piece="2"] { color: var(--piece-3); }
    .tracing .story-piece { opacity: 0.6; }
    .tracing .story-piece.is-current { opacity: 1; text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 5px; }

    /* ── SCENE ── The SVG's coordinate system is re-measured to the panel's
       real size (1 unit = 1 CSS px), so the sky / background / foreground
       bands are true shares of the visible picture. Falling snow is drawn
       on a <canvas> over it, which stays smooth on Chromebooks. */
    #sceneWrap { position: relative; flex: 1; min-height: 0; border-radius: 10px; overflow: hidden; background: #0d1430; }
    #sceneSvg, #flakeCanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #flakeCanvas { pointer-events: none; }
    /* Sky, sun, clouds and colors follow the timeline continuously
       (snowModel skyLevel / cloudLevel), so they need no CSS transitions. */
    .weather-badge {
      font-family: 'Space Mono', monospace; font-size: 0.72rem; color: var(--muted);
      text-align: center; min-height: 1.2em;
    }

    /* ── TIMELINE SLIDER (replaces the old "Hour N" bar) ── */
    .timeline {
      position: relative;
      background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
      padding: 6px 12px 4px; display: flex; flex-direction: column; gap: 2px;
    }
    .timeline.is-locked { opacity: 0.55; }
    .tl-head { font-family: 'Space Mono', monospace; font-size: 0.72rem; color: var(--muted); display: flex; align-items: baseline; gap: 6px; }
    .tl-head b { color: var(--text); font-size: 0.9rem; min-width: 2.6em; }
    .tl-lock { margin-left: auto; font-size: 0.68rem; }
    .tl-track { position: relative; padding-bottom: 16px; }
    #timeSlider {
      --pct: 0%;
      -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: transparent; cursor: pointer; display: block;
    }
    #timeSlider:disabled { cursor: not-allowed; }
    #timeSlider::-webkit-slider-runnable-track {
      height: 6px; border-radius: 3px;
      background: linear-gradient(to right, var(--accent4) 0 var(--pct), var(--border) var(--pct) 100%);
    }
    #timeSlider::-moz-range-track { height: 6px; border-radius: 3px; background: var(--border); }
    #timeSlider::-moz-range-progress { height: 6px; border-radius: 3px; background: var(--accent4); }
    #timeSlider::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none; width: 18px; height: 18px; border-radius: 50%;
      background: var(--accent4); border: 3px solid var(--surface); margin-top: -6px; box-shadow: 0 0 0 1px var(--accent4);
    }
    #timeSlider::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--accent4); border: 3px solid var(--surface); }
    #timeSlider:focus { outline: none; }
    #timeSlider:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--accent4); }
    #timeSlider:focus-visible::-moz-range-thumb { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--accent4); }
    #timeSlider:focus-visible { outline: 2px dashed var(--accent4); outline-offset: 3px; border-radius: 4px; }
    /* Ticks sit under the track; inset by half the thumb so hour 0 and the
       last hour line up with the thumb's centre at each end. */
    .tl-ticks { position: absolute; left: 9px; right: 9px; top: 18px; height: 16px; pointer-events: none; }
    .tl-tick { position: absolute; top: 0; width: 1px; height: 4px; background: var(--muted); opacity: 0.6; transform: translateX(-0.5px); }
    .tl-tick.major { height: 6px; opacity: 1; }
    /* Arrow-key hint: shows on hover, touch or keyboard focus, then fades. */
    .tl-hint {
      position: absolute; left: 50%; top: calc(100% + 6px); transform: translateX(-50%); z-index: 20;
      background: var(--surface); color: var(--text); border: 1px solid var(--accent4); border-radius: 7px;
      padding: 5px 12px; font-size: 16px; line-height: 1.3; white-space: nowrap; box-shadow: 0 6px 18px rgba(0,0,0,0.35);
      opacity: 0; pointer-events: none; transition: opacity 0.25s;
    }
    .tl-hint.show { opacity: 1; }
    .tl-tick span { position: absolute; top: 6px; left: 0; transform: translateX(-50%); font-family: 'Space Mono', monospace; font-size: 0.62rem; color: var(--muted); }

    /* ── PLAYBACK CONTROLS ── */
    .playback-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .play-btn {
      background: var(--accent4); color: #0a0c12; border: none; border-radius: 8px;
      padding: 7px 14px; font-family: 'Space Mono', monospace; font-weight: 700; font-size: 0.78rem;
      cursor: pointer; transition: filter 0.15s, transform 0.1s;
    }
    .play-btn:hover { filter: brightness(1.1); }
    .play-btn:active { transform: translateY(1px); }
    .play-btn:disabled, #replayBtn:disabled { opacity: 0.35; cursor: not-allowed; filter: none; }
    .speed-select {
      background: var(--surface2); color: var(--text); border: 1px solid var(--border);
      border-radius: 7px; padding: 6px 8px; font-family: 'Space Mono', monospace; font-size: 0.72rem;
    }

    /* ── GRAPH PANE ── */
    #explorerLayout { display: flex; gap: 16px; flex: 1; min-height: 0; }
    #explorerLayout.hidden { display: none; }
    #controlsCol { width: 244px; flex-shrink: 0; flex-direction: column; gap: 14px; overflow-y: auto; min-height: 0; padding: 2px; }
    #chartBox { flex: 1; min-width: 0; min-height: 0; container-type: size; display: flex; align-items: center; justify-content: center; }
    /* The plot is --hours units wide and --depth units tall with the SAME
       pixel size per unit (--u), so a grid cell is a real square. The axis
       labels take a fixed 58px (left) / 52px (bottom) and 14px / 10px of
       padding (right / top) — set to match in the Chart.js options. */
    #chartWrap {
      position: relative;
      --u: min((100cqw - 72px) / var(--hours), (100cqh - 62px) / var(--depth));
      width: calc(var(--u) * var(--hours) + 72px); height: calc(var(--u) * var(--depth) + 62px);
    }
    #chart { width: 100% !important; height: 100% !important; }
    .toggle-row { display: flex; flex-direction: column; gap: 10px; font-family: 'Space Mono', monospace; font-size: 0.74rem; color: var(--muted); }
    .toggle-row label { display: flex; align-items: center; gap: 6px; cursor: pointer; }

    /* ── EXPLORER BUILDER ── */
    #builderControls { display: flex; flex-direction: column; gap: 8px; }
    .builder-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-family: 'Space Mono', monospace; font-size: 0.72rem; color: var(--muted); }
    #segmentRows { display: flex; flex-direction: column; gap: 8px; }
    .segment-row {
      display: flex; align-items: center; gap: 6px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px 6px 12px; flex-wrap: wrap;
      border-left: 5px solid var(--piece-color, var(--border));
    }
    .seg-label { font-family: 'Space Mono', monospace; font-size: 0.72rem; font-weight: 700; color: var(--piece-color); width: 100%; }
    .seg-remove {
      background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 50%;
      width: 22px; height: 22px; cursor: pointer; font-size: 0.7rem; line-height: 1;
    }
    .seg-remove:hover { border-color: var(--accent2); color: var(--accent2); }
    .seg-remove[aria-disabled="true"] { opacity: 0.35; cursor: not-allowed; }
    .seg-remove[aria-disabled="true"]:hover { border-color: var(--border); color: var(--muted); }
    #addSegmentBtn {
      background: none; border: 1px dashed var(--border); color: var(--muted);
      border-radius: 8px; padding: 6px 10px; font-family: 'Space Mono', monospace; font-size: 0.72rem;
      cursor: pointer; align-self: flex-start;
    }
    #addSegmentBtn:hover { border-color: var(--accent4); color: var(--accent4); }
    #addSegmentBtn[aria-disabled="true"] { opacity: 0.4; cursor: not-allowed; }
    #addSegmentBtn[aria-disabled="true"]:hover { border-color: var(--border); color: var(--muted); }
    .builder-msg { font-size: 0.8rem; line-height: 1.35; color: var(--accent2); min-height: 1.1em; }

    /* ── STYLED DROPDOWN ("picker") ── No native <select> in the builder.
       Greyed options stay visible and show WHY on hover, keyboard focus or
       tap (Karl, 11/26: "That would push a later piece past 15 inches"). */
    .picker {
      display: inline-flex; align-items: center; justify-content: space-between; gap: 6px; max-width: 100%;
      background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 7px;
      padding: 5px 8px; font-family: 'Space Mono', monospace; font-size: 0.72rem; cursor: pointer; text-align: left;
      transition: border-color 0.15s;
    }
    .picker:hover, .picker[aria-expanded="true"] { border-color: var(--accent4); }
    .picker:focus-visible { outline: 2px solid var(--accent4); outline-offset: 2px; }
    .picker-caret { color: var(--muted); font-size: 0.7rem; }
    .picker-menu {
      position: fixed; z-index: 100; background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
      box-shadow: 0 10px 28px rgba(0,0,0,0.4); padding: 4px; max-height: 60vh; overflow-y: auto;
      font-family: 'Space Mono', monospace; font-size: 0.74rem; min-width: 120px; max-width: 320px;
    }
    .picker-option { padding: 6px 10px; border-radius: 6px; cursor: pointer; color: var(--text); display: flex; flex-direction: column; gap: 3px; }
    .picker-option:hover, .picker-option:focus { background: var(--surface2); outline: none; }
    .picker-option:focus-visible { box-shadow: inset 0 0 0 1px var(--accent4); }
    .picker-option.is-selected .opt-label { color: var(--accent4); font-weight: 700; }
    .picker-option.is-disabled { cursor: not-allowed; }
    .picker-option.is-disabled .opt-label { color: var(--muted); opacity: 0.6; text-decoration: line-through; text-decoration-thickness: 1px; }
    .opt-reason { display: none; font-family: 'DM Sans', sans-serif; font-size: 0.78rem; line-height: 1.3; color: var(--accent2); white-space: normal; }
    .picker-option.is-disabled:hover .opt-reason,
    .picker-option.is-disabled:focus .opt-reason,
    .picker-option.show-reason .opt-reason { display: block; }

    /* ── MATCH THE FORECAST ── */
    #matchArea { display: none; flex-direction: column; gap: 10px; flex: 1; min-height: 0; }
    #matchArea.active { display: flex; }
    #builderControls.hidden, #chartWrap.hidden, .toggle-row.hidden { display: none; }
    /* The four choice graphs are taller than wide (unit squares). JS measures
       #matchBox and picks 2x2 or 1x4, whichever gives bigger grid cells. */
    #matchBox { flex: 1; min-height: 0; min-width: 0; flex-direction: column; gap: 10px; }
    #matchTiles { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
    #matchBox.compact #matchTiles { flex: 0 0 auto; }
    #matchChoices { display: grid; gap: 12px; justify-content: center; align-content: center; }
    .match-choice {
      background: var(--surface); border: 2px solid var(--border); border-radius: 10px;
      cursor: pointer; padding: 4px; transition: border-color 0.15s, transform 0.1s;
      display: flex; align-items: center; justify-content: center;
      min-height: 0; min-width: 0; overflow: hidden;
    }
    .match-choice:hover:not(.resolved) { border-color: var(--accent4); }
    .match-choice:focus-visible { outline: 2px solid var(--accent4); outline-offset: 2px; }
    .match-choice.correct-pick { border-color: var(--accent3); }
    .match-choice.wrong-pick { border-color: var(--accent2); }
    .match-choice svg { width: 100%; height: 100%; display: block; }
    #matchVerdictHost { flex: 1; min-height: 0; display: flex; }
    #matchBox:not(.compact) #matchVerdictHost { display: none; }

    /* ── STREAK BAR (1A.3, Section 4) ── */
    #streakBar {
      flex-shrink: 0; align-items: center; gap: 18px; padding: 8px 16px; min-height: 76px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    }
    .streak-flame { display: flex; align-items: center; gap: 6px; min-width: 112px; }
    .streak-flame svg { width: 34px; height: 42px; display: block; }
    .streak-flame .flame-outer { fill: var(--flame); transition: fill 0.3s; }
    .streak-flame .flame-inner { fill: #ffd166; transition: fill 0.3s; }
    .streak-flame.out .flame-outer { fill: var(--border); }
    .streak-flame.out .flame-inner { fill: var(--muted); opacity: 0.5; }
    @keyframes flamePulse { 0% { transform: scale(1); } 40% { transform: scale(1.28); } 100% { transform: scale(1); } }
    .streak-flame.pulse svg { animation: flamePulse 0.5s ease-out; transform-origin: 50% 85%; }
    .streak-num { font-family: 'Space Mono', monospace; font-weight: 700; font-size: 38px; line-height: 1; color: var(--text); }
    .streak-lbl { font-size: 16px; color: var(--muted); line-height: 1.1; max-width: 3.6em; }
    .medal-track { position: relative; flex: 1; min-width: 180px; max-width: 340px; height: 56px; }
    .medal-track .track-bg, .medal-track .track-fill { position: absolute; left: 0; top: 18px; height: 6px; border-radius: 3px; }
    .medal-track .track-bg { right: 0; background: var(--border); }
    .medal-track .track-fill { background: var(--flame); width: 0; transition: width 0.4s; }
    .medal-mark { position: absolute; top: 7px; width: 28px; height: 28px; margin-left: -14px; }
    .medal-coin { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--muted); background: var(--surface); overflow: hidden; }
    .medal-mark.bronze.earned .medal-coin { background: var(--metal-bronze); border-color: #8c4f25; }
    .medal-mark.silver.earned .medal-coin { background: var(--metal-silver); border-color: #8e98a6; }
    .medal-mark.gold.earned .medal-coin   { background: var(--metal-gold);   border-color: #a86c08; }
    .medal-mark span { position: absolute; top: 31px; left: 50%; transform: translateX(-50%); font-family: 'Space Mono', monospace; font-size: 16px; font-weight: 700; color: var(--muted); white-space: nowrap; }
    .medal-mark.earned span { color: var(--text); }
    .stat-chip { display: flex; flex-direction: column; align-items: center; padding: 4px 12px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface2); min-width: 72px; }
    .stat-chip small { font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
    .stat-chip b { font-family: 'Space Mono', monospace; font-size: 22px; line-height: 1.2; color: var(--text); }
    .streak-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
    .streak-actions .hdr-btn, .streak-actions .play-btn { font-size: 16px; padding: 9px 16px; }
    #resetModeBtn { font-size: 13px; padding: 4px 8px; }
    #showResultBtn.hidden, #nextItemBtn.hidden, #checkBtn.hidden { display: none; }

    /* ── VERDICT / DIFFERENCE PANEL (1A.3, Section 3) ── */
    #verdictPanel {
      flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 8px;
      background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px;
      font-size: 17px; line-height: 1.35;
    }
    #verdictPanel.hidden { display: none; }
    #verdictPanel.is-right { box-shadow: inset 5px 0 0 var(--accent3); }
    #verdictPanel.is-wrong { box-shadow: inset 5px 0 0 var(--accent2); }
    .vp-head { font-size: 19px; font-weight: 700; display: flex; gap: 8px; align-items: baseline; }
    .vp-icon { font-family: 'Space Mono', monospace; font-weight: 700; }
    .is-right .vp-icon { color: var(--accent3); }
    .is-wrong .vp-icon { color: var(--accent2); }
    .vp-sides { display: flex; gap: 14px; min-height: 0; flex: 1; }
    .vp-side { flex: 1; min-width: 0; display: flex; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 8px 10px; }
    .vp-side svg { flex-shrink: 0; display: block; max-height: 100%; }
    .vp-side p { font-size: 17px; }
    .vp-side b { display: block; font-family: 'Space Mono', monospace; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
    .vp-note { color: var(--muted); font-size: 16px; }

    /* After the pick: the other three gray out; the chosen one gets a
       neutral highlight until the verdict colors it. */
    .match-choice { transition: opacity 0.25s, border-color 0.15s; }
    .match-choice.dimmed { opacity: 0.3; pointer-events: none; }
    .match-choice.your-pick { border-color: var(--text); border-style: dashed; }
    .match-choice.answer-was { opacity: 1; }
    .match-ghost { position: fixed; z-index: 60; pointer-events: none; transform-origin: 0 0; margin: 0; background: var(--surface); }

    /* ── LINK LINE (stake ↔ graph) ── */
    #linkLineSvg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }

    @media (prefers-reduced-motion: reduce) {
      .tl-hint, .match-choice { transition: none !important; }
      .mode-btn::after, .medal-coin::after { animation: none !important; display: none; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="header">
      <a class="hdr-btn back" href="index.html">← Home</a>
      <h1>Snow Challenge</h1>
      <nav id="modeNav" aria-label="Modes">
        <button class="hdr-btn mode-btn" data-mode="explorer" type="button">Explorer</button>
        <button class="hdr-btn mode-btn" data-mode="match" type="button">Match the Forecast</button>
      </nav>
      <button class="hdr-btn" id="themeBtn" type="button">🌙 Dark</button>
    </div>

    <div id="content">
      <svg id="linkLineSvg"><line id="linkLine" x1="0" y1="0" x2="0" y2="0" stroke="var(--accent4)" stroke-width="1.5" stroke-dasharray="4 4" opacity="0"/><circle id="linkDot" r="5" fill="var(--accent4)" opacity="0"/></svg>

      <!-- LEFT: Explorer's builder + graph, or a challenge's story, answer
           area and streak bar (#app[data-mode] decides what shows) -->
      <div id="graphPane">
        <div id="challengeStory" class="story-banner challenge-story" aria-live="polite"></div>
        <div id="mainRow">
          <div id="controlsCol">
            <div class="toggle-row" id="explorerToggles">
              <label><input type="checkbox" id="toggleSteps"> Show rise/run steps</label>
              <label><input type="checkbox" id="toggleStory"> Show the story</label>
            </div>
            <div id="builderControls">
              <div class="builder-row">
                <span>Starting depth:</span>
                <span id="startDepthHost"></span>
                <span>inches</span>
              </div>
              <div id="segmentRows"></div>
              <button id="addSegmentBtn" type="button">+ Add Segment</button>
              <div class="builder-msg" id="builderMsg" role="status" aria-live="polite"></div>
            </div>
          </div>
          <!-- chartBox sizes chartWrap so the plot keeps unit squares:
               one hour is as wide as one inch is tall (see #chartWrap CSS) -->
          <div id="chartBox"><div id="chartWrap"><canvas id="chart"></canvas></div></div>
          <div id="matchBox">
            <div id="matchTiles"><div id="matchChoices"></div></div>
            <div id="matchVerdictHost"></div>
          </div>
          <div id="sideCol"></div>
        </div>
        <div id="streakBar" aria-live="polite">
          <div class="streak-flame out" id="streakFlame" title="Streak: first-try right answers in a row">
            <svg viewBox="0 0 34 42" aria-hidden="true"><path class="flame-outer" d="M17 1c2 8 12 12 12 24a12 12 0 0 1-24 0c0-6 3-9 5-12 0 4 2 6 4 7-1-7 0-13 3-19z"/><path class="flame-inner" d="M17 20c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-5 3-6 0 2 1 3 2 3-1-3 0-6 1-9z"/></svg>
            <span class="streak-num" id="streakNum">0</span>
            <span class="streak-lbl">in a row</span>
          </div>
          <div class="medal-track" id="medalTrack" aria-label="Medals: 3 in a row bronze, 5 silver, 10 gold">
            <div class="track-bg"></div><div class="track-fill" id="trackFill"></div>
          </div>
          <div class="stat-chip"><small>Score</small><b id="scoreVal">0</b></div>
          <div class="stat-chip" title="Level = how many weather pieces each forecast has. 3 first-try right in a row moves you up."><small>Level</small><b id="levelVal">1</b></div>
          <div class="streak-actions">
            <button class="hdr-btn" id="resetModeBtn" type="button" title="Clear this challenge's score, streak, level and medal">↺ reset</button>
            <button class="hdr-btn hidden" id="showResultBtn" type="button">Show result</button>
            <button class="play-btn hidden" id="checkBtn" type="button">Check</button>
            <button class="play-btn hidden" id="nextItemBtn" type="button">Next →</button>
          </div>
        </div>
      </div>
      <div id="verdictPanel" class="hidden" role="status"></div>

      <!-- SCENE (right): the story sits above the picture -->
      <div id="scenePane">
        <div id="storyText" class="story-banner hidden"></div>
        <div id="sceneWrap">
          <svg id="sceneSvg" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Snow piling up against a measuring stake"></svg>
          <canvas id="flakeCanvas" aria-hidden="true"></canvas>
        </div>
        <div class="timeline" id="timeline">
          <div class="tl-head">
            <span>Hour</span><b id="hourReadout">0</b><span id="hourOf">of 6</span>
            <span class="tl-lock" id="tlLock" hidden>🔒 after you pick</span>
          </div>
          <div class="tl-track">
            <input type="range" id="timeSlider" min="0" max="6" step="0.01" value="0" aria-label="Time in hours" aria-describedby="tlHint">
            <div class="tl-ticks" id="tlTicks"></div>
          </div>
          <div class="tl-hint" id="tlHint" role="note">← → move 1 hour · Shift + ← → move ¼ hour</div>
        </div>
        <div class="playback-row">
          <button class="play-btn" id="playBtn" type="button" title="Play the story. On the slider: ← → move 1 hour · Shift + ← → move ¼ hour">▶ Play</button>
          <button class="hdr-btn" id="replayBtn" type="button">↻ Replay</button>
          <select class="speed-select" id="speedSelect" aria-label="Playback speed">
            <option value="slow">Slow</option>
            <option value="normal" selected>Normal</option>
            <option value="fast">Fast</option>
          </select>
        </div>
        <div class="weather-badge" id="weatherBadge">—</div>
      </div>
    </div>
  </div>

<script>
(function () {
  'use strict';

  // ── URL settings, so a link can open a specific situation ──
  //   ?mode=explorer | match   which mode to open (no mode = Explorer, for now)
  //   ?level=1..3              Match level for this visit (not saved)
  //   ?seed=N                  reproducible first Match round
  //   ?start=2&segs=snow:1:3:6,cloudy:2,sun:-1:1:1   Explorer forecast
  //   ?steps=1  ?story=1       tick the Explorer toggles
  //   ?at=end | ?at=H          show Explorer at the end / at hour H
  //   ?theme=light|dark        ?reset=1  clear saved score/level
  //   ?hours=10 ?depth=12      preview another graph scale (not saved)
  //   ?tile=2x2 | 1x4          force the Match grid layout
  //   ?birds=soon              first bird visit after ~1 second (for review)
  //   ?scene=night | day       force the scene type
  //   ?flavor=soon | plane | shooting | birds   a flavor event after ~1 second
  //   ?pick=right | wrong | 0-3  with ?mode=match: make that pick on load
  //   ?reveal=picked | mid | end  …then sit just after the pick, mid-trace
  //                               (just past the split for a wrong pick), or at the verdict
  //   ?quality=0..3            pin the performance level (0 = full; testing only)
  //   ?resetmode=match|story|draw  clear one challenge's score/streak/level/medal
  //   ?streak=N&best=N         (review) show the streak bar / medals at these numbers
  //   ?pin=4,7                 (review) pin these hours on the hoverable graph
  const URLP = (function () {
    const q = new URLSearchParams(location.search);
    const num = k => (q.has(k) && q.get(k) !== '' && !isNaN(+q.get(k)) ? +q.get(k) : null);
    let segs = null;
    if (q.get('segs')) {
      segs = q.get('segs').split(',').map(part => {
        const [w, a, b, c] = part.split(':');
        return w === 'cloudy' ? { weather: 'cloudy', hours: +a } : { weather: w, rise: +a, run: +b, hours: +c };
      });
    }
    return { mode: q.get('mode'), level: num('level'), seed: num('seed'), start: num('start'), segs,
      steps: q.get('steps') === '1', story: q.get('story') === '1', at: q.get('at'), theme: q.get('theme'), reset: q.get('reset') === '1',
      hours: num('hours'), depth: num('depth'), tile: q.get('tile'), birdsSoon: q.get('birds') === 'soon',
      scene: ['night', 'day'].includes(q.get('scene')) ? q.get('scene') : null, flavor: q.get('flavor'),
      pick: q.get('pick'), reveal: q.get('reveal'), quality: q.get('quality'), resetMode: q.get('resetmode'),
      streak: num('streak'), best: num('best'), pins: q.get('pin') ? q.get('pin').split(',').map(Number).filter(n => !isNaN(n)) : null };
  })();

  // The model at this visit's scale (default 12 h x 15 in, from snowModel.js).
  const SM = (URLP.hours || URLP.depth)
    ? window.SnowModel.createModel({ maxHours: URLP.hours || undefined, maxDepth: URLP.depth || undefined })
    : window.SnowModel;
  document.documentElement.style.setProperty('--hours', SM.MAX_HOURS);
  document.documentElement.style.setProperty('--depth', SM.MAX_DEPTH);

  if (URLP.reset) SM.resetProgress();
  if (URLP.resetMode && SM.SCORE_MODES.includes(URLP.resetMode)) SM.resetProgress(URLP.resetMode);
  const CHALLENGES = ['match']; // challenge modes built so far (mode ids from the spec)
  if (URLP.theme === 'light' || URLP.theme === 'dark') { try { sessionStorage.setItem('mm_theme', URLP.theme); } catch (e) {} }
  function currentLevel() {
    if (URLP.level >= 1 && URLP.level <= SM.MAX_LEVEL) return URLP.level;
    return SM.getScoreState(mode).level;
  }
  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let geom = null; // cached page rects for the stake-to-graph link line; null = re-measure
  const DEPTH_LABELS = new Set(SM.axisLabels(SM.MAX_DEPTH));

  // ── THEME (same key/pattern as the rest of the site) ──
  const THEME_KEY = 'mm_theme';
  const themeBtn = document.getElementById('themeBtn');
  function getTheme() { try { return sessionStorage.getItem(THEME_KEY) || 'dark'; } catch (e) { return 'dark'; } }
  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    try { sessionStorage.setItem(THEME_KEY, theme); } catch (e) {}
    themeBtn.textContent = theme === 'light' ? '☀ Light' : '🌙 Dark';
    // Piece colors come from ONE place (SnowModel.PIECE_COLORS).
    SM.PIECE_COLORS[theme === 'light' ? 'light' : 'dark'].forEach((c, i) => document.documentElement.style.setProperty(`--piece-${i + 1}`, c));
    chartTextColor = theme === 'light' ? '#1a1d27' : '#ffffff';
    if (chart) { updateChartColors(); chart.update(); }
  }
  themeBtn.onclick = () => applyTheme(getTheme() === 'light' ? 'dark' : 'light');

  // ── STREAK BAR + MEDAL MODE BUTTONS (1A.3, Section 4) ──
  // Each challenge has its own score, streak, level and best medal. The
  // streak bar shows the current mode; each header button wears its own
  // mode's best medal.
  const MEDAL_NAMES = { bronze: 'Bronze', silver: 'Silver', gold: 'Gold' };
  const streakNum = document.getElementById('streakNum');
  const streakFlame = document.getElementById('streakFlame');
  const trackFill = document.getElementById('trackFill');
  const medalTrack = document.getElementById('medalTrack');
  const TRACK_MAX = SM.MEDAL_THRESHOLDS[0][0]; // 10 = gold
  SM.MEDAL_THRESHOLDS.slice().reverse().forEach(([n, name]) => {
    const m = document.createElement('div');
    m.className = `medal-mark ${name}`; m.dataset.medal = name;
    m.style.left = (n / TRACK_MAX * 100) + '%';
    m.title = `${MEDAL_NAMES[name]}: ${n} in a row`;
    m.innerHTML = `<div class="medal-coin"></div><span>${n}</span>`;
    medalTrack.appendChild(m);
  });
  let shownStreak = null;
  // Review links can show exact numbers (?streak=&best=) without saving them.
  function scoreStateFor(m) {
    const s = SM.getScoreState(m);
    if (URLP.streak != null && m === mode) { s.streak = URLP.streak; s.bestStreak = Math.max(s.streak, URLP.best != null ? URLP.best : 0); s.bestMedal = SM.medalForStreak(s.bestStreak); }
    return s;
  }
  function refreshScoreDisplay() {
    document.querySelectorAll('.mode-btn').forEach(btn => {
      const m = btn.dataset.mode;
      btn.classList.remove('medal-bronze', 'medal-silver', 'medal-gold');
      if (!SM.SCORE_MODES.includes(m)) return;
      const medal = scoreStateFor(m).bestMedal;
      if (medal !== 'none') btn.classList.add(`medal-${medal}`);
      btn.title = medal === 'none' ? 'No medal yet: 3 first-try right in a row earns bronze' : `${MEDAL_NAMES[medal]} medal`;
    });
    if (!SM.SCORE_MODES.includes(mode)) return;
    const s = scoreStateFor(mode);
    document.getElementById('scoreVal').textContent = s.score;
    document.getElementById('levelVal').textContent = currentLevel();
    streakNum.textContent = s.streak;
    streakFlame.classList.toggle('out', s.streak === 0);
    if (shownStreak !== null && s.streak > shownStreak && !prefersReducedMotion) {
      streakFlame.classList.remove('pulse'); void streakFlame.offsetWidth; streakFlame.classList.add('pulse');
    }
    shownStreak = s.streak;
    trackFill.style.width = (Math.min(TRACK_MAX, s.streak) / TRACK_MAX * 100) + '%';
    medalTrack.querySelectorAll('.medal-mark').forEach(mk => mk.classList.toggle('earned', SM.MEDAL_STREAK[s.bestMedal] >= SM.MEDAL_STREAK[mk.dataset.medal]));
  }
  document.getElementById('resetModeBtn').onclick = () => {
    if (!SM.SCORE_MODES.includes(mode)) return;
    if (!confirm('Clear this challenge\'s score, streak, level and medal on this device?')) return;
    SM.resetProgress(mode); shownStreak = null; refreshScoreDisplay();
  };

  // ── MODE SWITCH ──
  const chartWrap = document.getElementById('chartWrap');
  const builderControls = document.getElementById('builderControls');
  const explorerToggles = document.getElementById('explorerToggles');
  const appEl = document.getElementById('app');
  const verdictPanel = document.getElementById('verdictPanel');
  let mode = 'explorer';
  function setMode(next) {
    stopPlayback();
    clearAutoplay();
    geom = null;
    closePicker();
    clearPins();
    mode = next;
    appEl.dataset.mode = mode;
    shownStreak = null;
    document.querySelectorAll('.mode-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.mode === mode);
      b.setAttribute('aria-pressed', String(b.dataset.mode === mode));
    });
    verdictPanel.classList.add('hidden');
    document.getElementById('storyText').classList.toggle('hidden', mode === 'explorer' && !toggleStory.checked);
    refreshScoreDisplay();
    if (mode === 'match') { document.getElementById('matchVerdictHost').appendChild(verdictPanel); updateLinkLine(null); newMatchItem(); }
    else {
      scene.overlay = null; scene.type = explorerSceneType;
      speedSelect.value = 'normal'; // Explorer's default speed
      setPlaybackEnabled(true); renderExplorerAtRest();
    }
  }
  document.querySelectorAll('.mode-btn').forEach(b => { b.onclick = () => { if (b.dataset.mode !== mode) setMode(b.dataset.mode); }; });

  // ══════════════════════════════════════════════════════════════
  // STYLED DROPDOWN ("picker")
  // A button that opens a list. Options: {value, label, ok, reason}.
  // ok:false options stay in the list, greyed, and show their reason on
  // hover, keyboard focus or tap — they can't be chosen.
  // ══════════════════════════════════════════════════════════════
  let openPicker = null;
  function makePicker({ label, options, value, onChange }) {
    const btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'picker';
    btn.setAttribute('aria-haspopup', 'listbox'); btn.setAttribute('aria-expanded', 'false');
    const cur = options.find(o => o.value === value) || options[0];
    btn.setAttribute('aria-label', `${label}: ${cur ? cur.label : ''}`);
    btn.innerHTML = '<span class="picker-value"></span><span class="picker-caret" aria-hidden="true">▾</span>';
    btn.querySelector('.picker-value').textContent = cur ? cur.label : '';
    btn.addEventListener('click', e => {
      e.stopPropagation();
      if (openPicker && openPicker.btn === btn) { closePicker(); return; }
      showPickerMenu(btn, label, options, value, onChange);
    });
    btn.addEventListener('keydown', e => {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); showPickerMenu(btn, label, options, value, onChange); }
    });
    return btn;
  }
  function showPickerMenu(btn, label, options, value, onChange) {
    closePicker();
    const menu = document.createElement('div');
    menu.className = 'picker-menu'; menu.setAttribute('role', 'listbox'); menu.setAttribute('aria-label', label);
    options.forEach(o => {
      const item = document.createElement('div');
      const disabled = o.ok === false;
      item.className = 'picker-option' + (disabled ? ' is-disabled' : '') + (o.value === value ? ' is-selected' : '');
      item.setAttribute('role', 'option'); item.tabIndex = -1;
      item.setAttribute('aria-selected', String(o.value === value));
      if (disabled) item.setAttribute('aria-disabled', 'true');
      const lab = document.createElement('span'); lab.className = 'opt-label'; lab.textContent = o.label; item.appendChild(lab);
      if (disabled) {
        const why = document.createElement('span'); why.className = 'opt-reason'; why.textContent = o.reason; item.appendChild(why);
        item.title = o.reason;
      }
      item.addEventListener('click', e => {
        e.stopPropagation();
        if (disabled) { item.classList.add('show-reason'); item.focus(); return; } // tap shows why
        closePicker(); btn.focus(); onChange(o.value);
      });
      item.addEventListener('mouseenter', () => item.focus({ preventScroll: true }));
      menu.appendChild(item);
    });
    document.body.appendChild(menu);
    const r = btn.getBoundingClientRect();
    menu.style.minWidth = r.width + 'px';
    const mh = menu.offsetHeight, mw = menu.offsetWidth;
    menu.style.left = Math.max(8, Math.min(r.left, innerWidth - mw - 8)) + 'px';
    const below = innerHeight - r.bottom;
    menu.style.top = (below >= mh + 8 || below >= r.top ? r.bottom + 4 : Math.max(8, r.top - mh - 4)) + 'px';
    menu.addEventListener('keydown', e => {
      const items = Array.from(menu.children);
      const idx = items.indexOf(document.activeElement);
      if (e.key === 'ArrowDown') { e.preventDefault(); items[Math.min(items.length - 1, idx + 1)].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); items[Math.max(0, idx - 1)].focus(); }
      else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (idx >= 0) items[idx].click(); }
      else if (e.key === 'Escape') { e.preventDefault(); closePicker(); btn.focus(); }
      else if (e.key === 'Tab') { closePicker(); }
    });
    openPicker = { btn, menu };
    btn.setAttribute('aria-expanded', 'true');
    (menu.querySelector('.is-selected') || menu.firstChild).focus({ preventScroll: true });
  }
  function closePicker() {
    if (!openPicker) return;
    openPicker.menu.remove();
    openPicker.btn.setAttribute('aria-expanded', 'false');
    openPicker = null;
  }
  document.addEventListener('click', closePicker);
  window.addEventListener('resize', closePicker);

  // ══════════════════════════════════════════════════════════════
  // CHART.JS SETUP (Explorer's main graph)
  // ══════════════════════════════════════════════════════════════
  let chartTextColor = getTheme() === 'light' ? '#1a1d27' : '#ffffff';
  // Light mode needed noticeably darker gridlines to be readable on white.
  const gridColor = () => getTheme() === 'light' ? 'rgba(40,50,120,0.30)' : 'rgba(160,180,255,0.28)';
  const cssVar = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const runBlue = getComputedStyle(document.documentElement).getPropertyValue('--run-blue').trim() || '#1A56DB';
  const riseOrange = getComputedStyle(document.documentElement).getPropertyValue('--rise-orange').trim() || '#E07B00';

  // Number captions on the rise/run staircase: "3 hours" under each blue
  // run leg, "+1 inch" beside each orange rise leg. If any caption would
  // not fit or would overlap another, only each piece's first step is
  // captioned so the labels never pile up.
  let stepLabels = [];
  const stepLabelPlugin = {
    id: 'stepLabels',
    afterDatasetsDraw(c) {
      if (!stepLabels.length) return;
      const { ctx, scales: { x, y } } = c;
      ctx.save();
      ctx.font = "bold 12px 'Space Mono', monospace";
      ctx.lineJoin = 'round';
      const halo = getTheme() === 'light' ? '#ffffff' : '#0f1117';
      const drawText = (text, px, py, align, baseline, color) => {
        ctx.textAlign = align; ctx.textBaseline = baseline;
        ctx.strokeStyle = halo; ctx.lineWidth = 4; ctx.strokeText(text, px, py);
        ctx.fillStyle = color; ctx.fillText(text, px, py);
      };
      const TEXT_H = 13;
      const area = c.chartArea;
      const placed = stepLabels.map(l => {
        const w = ctx.measureText(l.text).width;
        if (l.kind === 'run') {
          const x0 = x.getPixelForValue(l.x0), x1 = x.getPixelForValue(l.x1);
          const ly = y.getPixelForValue(l.y);
          // Away from the graph line: below when snowing, above when
          // melting — unless that would leave the plot (a run along depth 0
          // or the top line), then the other side.
          let above = l.melting;
          if (!above && ly + 6 + TEXT_H > area.bottom) above = true;
          if (above && ly - 6 - TEXT_H < area.top) above = false;
          const py = ly + (above ? -6 : 6);
          const top = above ? py - TEXT_H : py;
          return { l, px: (x0 + x1) / 2, py, above, fits: (x1 - x0) > w + 6, box: [(x0 + x1) / 2 - w / 2, top, (x0 + x1) / 2 + w / 2, top + TEXT_H] };
        }
        const px = x.getPixelForValue(l.x) + 6;
        const py = (y.getPixelForValue(l.y0) + y.getPixelForValue(l.y1)) / 2;
        return { l, px, py, fits: true, box: [px, py - TEXT_H / 2, px + w, py + TEXT_H / 2] };
      });
      const overlaps = (a, b) => a[0] < b[2] && b[0] < a[2] && a[1] < b[3] && b[1] < a[3];
      const crowded = placed.some(p => !p.fits) ||
        placed.some((p, i) => placed.some((q, j) => j > i && overlaps(p.box, q.box)));
      for (const p of placed) {
        if (crowded && !p.l.firstOfSeg) continue;
        if (p.l.kind === 'run') drawText(p.l.text, p.px, p.py, 'center', p.above ? 'bottom' : 'top', runBlueLabel());
        else drawText(p.l.text, p.px, p.py, 'left', 'middle', riseOrange);
      }
      ctx.restore();
    },
  };
  // #1A56DB is too dark to read as text on the dark background; use a
  // lighter tint of the same blue there (lines keep the exact class color).
  const runBlueLabel = () => getTheme() === 'light' ? runBlue : '#6f9bff';

  // ── Piece colors on graph lines (1A.3, Section 2) ──
  // A line's forecast decides each straight bit's color: the piece at the
  // bit's midpoint. Chart points include every corner, so colors change
  // exactly at the corners.
  const pieceColor = i => cssVar(`--piece-${(i % 3) + 1}`);
  const lineColorFor = (forecast) => ctx => {
    if (!forecast) return chartTextColor;
    const mid = (ctx.p0.parsed.x + ctx.p1.parsed.x) / 2;
    return pieceColor(Math.max(0, SM.pieceIndexAt(forecast, mid)));
  };
  // What the chart shows (set per mode):
  //   main      ink line through these points (full), or null
  //   trace     a forecast drawn up to the slider in piece colors, or null
  //   fill      a forecast whose snow fill grows under the trace, or null
  //   traceAll  draw the whole trace regardless of the slider (after a verdict)
  //   steps     forecast for the rise/run toggle, or null
  //   hover     forecast hover/pin snaps to, or null (no hover)
  const chartView = { main: null, trace: null, fill: null, traceAll: false, steps: null, hover: null, markers: [] };

  // ── Hover and pin (1A.3, Section 5; spec 4b; Full Lab's look) ──
  // Hover snaps to the nearest WHOLE hour on the line; a soft dot, dashed
  // guides and value chips on both axes. Click pins (click again unpins).
  // Pins clear on a new round. Depths print as fractions, never decimals.
  let hoverPt = null;            // { t, d } on the chart
  let pins = [];                 // [{ t, d }] on the chart
  function drawCoordDot(c2, x, y, label, fill, alpha, fontSize) {
    c2.globalAlpha = alpha;
    c2.beginPath(); c2.arc(x, y, 6, 0, Math.PI * 2); c2.fillStyle = fill; c2.fill();
    c2.strokeStyle = '#ffffff'; c2.lineWidth = 2; c2.stroke();
    c2.globalAlpha = 1;
    c2.font = `bold ${fontSize}px "Space Mono", monospace`; c2.textAlign = 'center'; c2.textBaseline = 'alphabetic';
    const w = c2.measureText(label).width, ly = y - 14;
    c2.fillStyle = 'rgba(15,17,23,0.9)'; c2.fillRect(x - w / 2 - 5, ly - fontSize, w + 10, fontSize + 7);
    c2.fillStyle = '#ffffff'; c2.fillText(label, x, ly);
  }
  function drawAxisChip(c2, x, y, text, align) {
    c2.textAlign = align; c2.textBaseline = 'middle';
    const w = c2.measureText(text).width;
    const bx = align === 'center' ? x - w / 2 - 5 : x - w - 10;
    c2.fillStyle = 'rgba(15,17,23,0.92)'; c2.fillRect(bx, y - 11, w + 10, 22);
    c2.fillStyle = '#ffd740'; c2.fillText(text, align === 'center' ? x : x - 5, y + 1);
  }
  const ptLabel = p => `(${SM.formatMixed(p.t)}, ${SM.formatMixed(p.d)})`;
  const hoverPlugin = {
    id: 'hoverPins',
    afterDatasetsDraw(c) {
      const { ctx, scales: { x, y } } = c;
      ctx.save();
      // Draw-mode corner markers (the student's clicked points).
      for (const m of chartView.markers) {
        ctx.beginPath(); ctx.arc(x.getPixelForValue(m.t), y.getPixelForValue(m.d), m.r || 5, 0, Math.PI * 2);
        ctx.fillStyle = m.fill || chartTextColor; ctx.fill();
        if (m.ring) { ctx.strokeStyle = m.ring; ctx.lineWidth = 2; ctx.stroke(); }
      }
      for (const p of pins) drawCoordDot(ctx, x.getPixelForValue(p.t), y.getPixelForValue(p.d), ptLabel(p), '#ff4081', 1, 16);
      if (hoverPt) {
        const px = x.getPixelForValue(hoverPt.t), py = y.getPixelForValue(hoverPt.d);
        ctx.strokeStyle = 'rgba(255,215,64,0.65)'; ctx.lineWidth = 1.5; ctx.setLineDash([4, 4]);
        ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px, y.bottom); ctx.moveTo(px, py); ctx.lineTo(x.left, py); ctx.stroke();
        ctx.setLineDash([]);
        ctx.font = 'bold 16px "Space Mono", monospace';
        drawAxisChip(ctx, px, y.bottom + 14, SM.formatMixed(hoverPt.t), 'center');
        drawAxisChip(ctx, x.left - 4, py, SM.formatMixed(hoverPt.d), 'right');
        drawCoordDot(ctx, px, py, ptLabel(hoverPt), '#ffd740', 0.75, 18);
      }
      ctx.restore();
    },
  };

  const chart = new Chart(document.getElementById('chart'), {
    plugins: [stepLabelPlugin, hoverPlugin],
    type: 'line',
    data: { datasets: [
      // `order`: lower draws on top. Trace (colored) over the ink line,
      // both over the steps, all over the snow fill.
      { label: 'main', order: 1, data: [], borderColor: chartTextColor, backgroundColor: 'transparent', borderWidth: 2.5, pointRadius: 0, tension: 0 },
      { label: 'run', order: 2, data: [], showLine: true, borderColor: runBlue, backgroundColor: 'transparent', borderWidth: 2, pointRadius: 0, borderDash: [5,3], tension: 0 },
      { label: 'rise', order: 2, data: [], showLine: true, borderColor: riseOrange, backgroundColor: 'transparent', borderWidth: 2, pointRadius: 0, borderDash: [5,3], tension: 0 },
      // Snow fill under the traced line.
      { label: 'snow', order: 5, data: [], borderColor: cssVar('--snow-edge'), backgroundColor: cssVar('--snow-fill'), borderWidth: 1.5, pointRadius: 0, tension: 0, fill: 'origin' },
      { label: 'trace', order: 0, data: [], borderColor: chartTextColor, backgroundColor: 'transparent', borderWidth: 3.5, pointRadius: 0, tension: 0, segment: {} },
    ]},
    options: {
      animation: false, responsive: true, maintainAspectRatio: false,
      // Axis labels get a FIXED size (58px left, 52px bottom) plus 14px/10px
      // of padding, so #chartWrap can be sized to leave a plot with unit
      // squares. Keep in step with the #chartWrap CSS.
      layout: { padding: { top: 10, right: 14, bottom: 0, left: 0 } },
      onResize: () => { geom = null; requestAnimationFrame(refreshLinkLine); },
      plugins: { legend: { display: false }, tooltip: { enabled: false } },
      scales: {
        x: {
          type: 'linear', min: 0, max: SM.MAX_HOURS,
          afterFit(scale) { scale.height = 52; },
          title: { display: true, text: 'Time (hours)', color: chartTextColor, font: { family: 'Space Mono', size: 13, weight: 'bold' } },
          ticks: { color: chartTextColor, font: { family: 'Space Mono', size: 12, weight: 'bold' }, stepSize: 1, autoSkip: false },
          grid: { color: gridColor() },
        },
        y: {
          min: 0, max: SM.MAX_DEPTH,
          afterFit(scale) { scale.width = 58; },
          title: { display: true, text: 'Snow depth (inches)', color: chartTextColor, font: { family: 'Space Mono', size: 13, weight: 'bold' } },
          // A gridline every inch, a number every 3 (and always the top).
          ticks: { color: chartTextColor, font: { family: 'Space Mono', size: 12, weight: 'bold' }, stepSize: 1, autoSkip: false,
            callback: v => (DEPTH_LABELS.has(v) ? v : '') },
          grid: { color: gridColor() },
        },
      },
    },
  });
  function updateChartColors() {
    chart.data.datasets[0].borderColor = chartTextColor;
    chart.options.scales.x.title.color = chartTextColor;
    chart.options.scales.x.ticks.color = chartTextColor;
    chart.options.scales.y.title.color = chartTextColor;
    chart.options.scales.y.ticks.color = chartTextColor;
    chart.options.scales.x.grid.color = gridColor();
    chart.options.scales.y.grid.color = gridColor();
    chart.data.datasets[3].borderColor = cssVar('--snow-edge');
    chart.data.datasets[3].backgroundColor = cssVar('--snow-fill');
  }

  // Corners of `forecast` from hour 0 up to `upto`, ending exactly at upto.
  function linePoints(forecast, upto) {
    const pts = [{ x: 0, y: SM.depthAt(forecast, 0) }];
    for (const p of SM.forecastPoints(forecast)) if (p.t > 0 && p.t < upto) pts.push({ x: p.t, y: SM.depthAt(forecast, p.t) });
    if (upto > 0) pts.push({ x: upto, y: SM.depthAt(forecast, upto) });
    return pts;
  }
  // Redraw the chart for the current view at slider hour t.
  function renderChart(t) {
    const v = chartView;
    const ds = chart.data.datasets;
    ds[0].data = v.main ? v.main.map(p => ({ x: p.t, y: p.d })) : [];
    if (v.trace) {
      const tot = SM.forecastTotalHours(v.trace);
      ds[4].data = linePoints(v.trace, v.traceAll ? tot : Math.min(t, tot));
      ds[4].segment = { borderColor: lineColorFor(v.trace) };
    } else ds[4].data = [];
    ds[3].data = v.fill && t > 0 ? linePoints(v.fill, Math.min(t, SM.forecastTotalHours(v.fill))) : [];
    if (v.steps && toggleSteps.checked) {
      const { runPts, risePts, labels } = stepPoints(v.steps, t);
      ds[1].data = runPts; ds[2].data = risePts; stepLabels = labels;
    } else if (v.diffSteps) {
      ds[1].data = v.diffSteps.runPts; ds[2].data = v.diffSteps.risePts; stepLabels = v.diffSteps.labels;
    } else { ds[1].data = []; ds[2].data = []; stepLabels = []; }
    chart.update('none');
  }
  // ══════════════════════════════════════════════════════════════
  // SCENE (Spec v2, Section 3)
  // Three bands top to bottom: sky (30%), distant hills (20%), and the
  // foreground (50%) where the snowpack rises from the ground line to the
  // MAX_DEPTH line at the top of the band. SM.sceneLayout() owns that
  // geometry; the stake, snow top and link line all use its one scale.
  // ══════════════════════════════════════════════════════════════
  const SVGNS = 'http://www.w3.org/2000/svg';
  const sceneWrap = document.getElementById('sceneWrap');
  const sceneSvg = document.getElementById('sceneSvg');
  const flakeCanvas = document.getElementById('flakeCanvas');
  const fctx = flakeCanvas.getContext('2d');
  const weatherBadge = document.getElementById('weatherBadge');
  const linkLine = document.getElementById('linkLine');

  const FLAKE_DPR_CAP = 1.5;
  const LAND_MS = 250;                  // a landing flake squashes and fades this long
  const BIRD_MIN_S = 15, BIRD_MAX_S = 40; // seconds between bird visits
  // Flake density tiers, set by the snowing RATE (inches per hour):
  // light below 1, medium 1 to under 2, heavy 2 and up. [background, foreground]
  const FLAKE_TIERS = { 0: [0, 0], 1: [24, 14], 2: [48, 30], 3: [85, 55] };
  const tierForRate = r => (r <= 0 ? 0 : r < 1 ? 1 : r < 2 ? 2 : 3);
  const STAKE_X = 0.16;                 // stake position, share of scene width
  const FEEDER_X = 0.80;                // bird feeder pole, share of scene width

  let L = null;          // current SM.sceneLayout()
  let el = {};           // refs to dynamic scene parts, rebuilt with the scene
  // type: 'night' | 'day' (Section 4). overlay: the Match reveal (Section 2).
  const scene = { forecast: null, hour: 0, neutral: false, depth: 0, tier: 0, weather: 'none', type: 'night', sun: 0, bright: false, overlay: null };
  // Explorer has no seed: pick day or night once per visit and keep it
  // while the student edits (?scene= forces either).
  const explorerSceneType = URLP.scene || (Math.random() < 0.5 ? 'night' : 'day');

  function svgEl(tag, attrs, parent) {
    const n = document.createElementNS(SVGNS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }

  // ── Scene palettes (Phase 1A.2, Section 4) ──
  // A night scene sits at `night` and brightens toward `nightLit` as the sun
  // rises. A day scene runs clear → overcast with the clouds, and → sunny
  // with the sun. Every backdrop stays a mid/dark tone so the white top of
  // the snow keeps at least 3:1 contrast against it.
  const PALETTES = {
    // yard0/yard1 = the grass field, far (hazier) → near; grass = blade
    // color; snowShade = what the far field turns as snow covers it (a
    // shaded snow-blue, never white, so the snow's top edge still reads).
    night:       { sky0: '#0b1230', sky1: '#1b2752', sky2: '#2d3b6a', hillFar: '#2a3762', hillNear: '#243152', tree: '#27493f', yard0: '#20322f', yard1: '#132219', grass: '#3f6b3c', snowShade: '#4a5878', ground0: '#6e4d33', ground1: '#3b291b', cloudSnow: '#7d87ac', cloudCloudy: '#aab3d2' },
    nightLit:    { sky0: '#3f78c0', sky1: '#86b6e6', sky2: '#f3d6aa', hillFar: '#6f86ad', hillNear: '#55709a', tree: '#3c6b56', yard0: '#55705f', yard1: '#3d5a45', grass: '#6d9a58', snowShade: '#71839f', ground0: '#8f6646', ground1: '#5c402b', cloudSnow: '#c4ccdc', cloudCloudy: '#dde3ee' },
    dayClear:    { sky0: '#5f9ad8', sky1: '#9cc6ee', sky2: '#d3e6f6', hillFar: '#7f9cc0', hillNear: '#6788aa', tree: '#4a7a60', yard0: '#6e8f68', yard1: '#4f7244', grass: '#8cc05e', snowShade: '#7486a6', ground0: '#8f6646', ground1: '#5c402b', cloudSnow: '#b9c2d1', cloudCloudy: '#dfe4ec' },
    dayOvercast: { sky0: '#8794aa', sky1: '#a6b1c3', sky2: '#c2cad7', hillFar: '#8492a9', hillNear: '#6f7f98', tree: '#4d6c5e', yard0: '#667a68', yard1: '#4a5f4c', grass: '#86a86a', snowShade: '#6f7f98', ground0: '#7f5c41', ground1: '#523a28', cloudSnow: '#9ba5b8', cloudCloudy: '#cdd3de' },
    daySunny:    { sky0: '#2f86de', sky1: '#79b6ef', sky2: '#cfe6f8', hillFar: '#7c9ac2', hillNear: '#5f83ab', tree: '#477d5d', yard0: '#6f925f', yard1: '#557e44', grass: '#95cc5c', snowShade: '#7486a6', ground0: '#97704d', ground1: '#614530', cloudSnow: '#ffffff', cloudCloudy: '#ffffff' },
  };
  const rgbOf = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
  function mixHex(a, b, t) {
    const A = rgbOf(a), B = rgbOf(b);
    return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join('');
  }
  function mixPal(a, b, t) { const o = {}; for (const k in a) o[k] = mixHex(a[k], b[k], t); return o; }
  function scenePalette(type, sun, cloud) {
    if (type === 'night') return mixPal(PALETTES.night, PALETTES.nightLit, sun);
    return mixPal(mixPal(PALETTES.dayClear, PALETTES.dayOvercast, cloud), PALETTES.daySunny, sun);
  }

  function buildScene() {
    const w = Math.round(sceneWrap.clientWidth), h = Math.round(sceneWrap.clientHeight);
    if (!w || !h) return;
    L = SM.sceneLayout(w, h);
    const { skyBottom, fgTop } = L, I = L.inset, m = L.mini, D = SM.MAX_DEPTH;
    sceneSvg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    const dpr = Math.min(FLAKE_DPR_CAP, window.devicePixelRatio || 1); // cap: 2x screens cost 4x the pixels
    flakeCanvas.width = Math.round(w * dpr); flakeCanvas.height = Math.round(h * dpr);
    fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    flakes.length = 0; birds.length = 0;

    const rng = SM.makeRng(20261126); // fixed seed: the scene looks the same every time
    const R = (a, b) => a + rng() * (b - a);
    const S = Math.min(w, h);
    const hillsGeo = SM.sceneHills(w, h);
    const ox = I.ovX0, ovW = I.ovW, px = I.pxPerInch;
    const insetBottom = I.y + I.h;

    let defs = `
      <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="${fgTop}" gradientUnits="userSpaceOnUse">
        <stop class="skyStop" offset="0" stop-color="#0b1230"/><stop class="skyStop" offset="0.6" stop-color="#1b2752"/><stop class="skyStop" offset="1" stop-color="#2d3b6a"/></linearGradient>
      <radialGradient id="moonGlow"><stop offset="0" stop-color="#e9efff" stop-opacity="0.45"/><stop offset="1" stop-color="#e9efff" stop-opacity="0"/></radialGradient>
      <radialGradient id="sunGlow"><stop offset="0" stop-color="#ffe9a0" stop-opacity="0.75"/><stop offset="1" stop-color="#ffd740" stop-opacity="0"/></radialGradient>
      <linearGradient id="yardG" x1="0" y1="${fgTop}" x2="0" y2="${h}" gradientUnits="userSpaceOnUse">
        <stop class="yardStop" offset="0" stop-color="#20322f"/><stop class="yardStop" offset="1" stop-color="#132219"/></linearGradient>
      <linearGradient id="insetG" x1="0" y1="${I.y}" x2="0" y2="${I.groundY}" gradientUnits="userSpaceOnUse">
        <stop class="insetStop" offset="0" stop-color="#1c2a2a"/><stop class="insetStop" offset="1" stop-color="#132219"/></linearGradient>
      <linearGradient id="groundG" x1="0" y1="${I.groundY}" x2="0" y2="${insetBottom}" gradientUnits="userSpaceOnUse">
        <stop class="groundStop" offset="0" stop-color="#6e4d33"/><stop class="groundStop" offset="1" stop-color="#3b291b"/></linearGradient>
      <linearGradient id="snowG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d9e3f5"/></linearGradient>
      <pattern id="snowTex" width="22" height="18" patternUnits="userSpaceOnUse">
        <circle cx="3" cy="4" r="0.8" fill="#aebfe0" opacity="0.55"/><circle cx="14" cy="11" r="0.7" fill="#aebfe0" opacity="0.5"/>
        <circle cx="9" cy="15" r="0.6" fill="#ffffff" opacity="0.9"/><circle cx="19" cy="3" r="0.6" fill="#ffffff" opacity="0.8"/></pattern>
      <pattern id="groundSpeck" width="17" height="11" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="3" r="0.6" fill="#9fb2d4" opacity="0.6"/><circle cx="11" cy="8" r="0.5" fill="#9fb2d4" opacity="0.5"/><circle cx="14" cy="2" r="0.5" fill="#ffffff" opacity="0.8"/></pattern>
      <clipPath id="insetClip"><rect x="${I.x}" y="${I.y}" width="${I.w}" height="${I.h}" rx="9"/></clipPath>
      <clipPath id="ovSnowClip"><rect x="${I.x}" y="${I.y}" width="${ox - I.x}" height="${I.h}"/><rect x="${ox + ovW}" y="${I.y}" width="${Math.max(0, I.x + I.w - ox - ovW)}" height="${I.h}"/></clipPath>`;

    // ── Sky, stars, moon, sun, clouds (top band) ──
    let sky = `<rect x="0" y="0" width="${w}" height="${fgTop + 2}" fill="url(#skyG)"/><g id="stars">`;
    for (let i = 0; i < Math.round(w / 18); i++) {
      sky += `<circle cx="${R(0, w).toFixed(1)}" cy="${R(4, skyBottom * 0.95).toFixed(1)}" r="${R(0.4, 1.1).toFixed(2)}" fill="#ffffff" opacity="${R(0.25, 0.7).toFixed(2)}"/>`;
    }
    sky += '</g>';
    const mr = S * 0.035;
    sky += `<g id="moonGroup"><circle cx="${w * 0.36}" cy="${h * 0.1}" r="${mr * 2.6}" fill="url(#moonGlow)"/>
      <circle cx="${w * 0.36}" cy="${h * 0.1}" r="${mr}" fill="#eef2ff"/><circle cx="${w * 0.36 + mr * 0.35}" cy="${h * 0.1 - mr * 0.15}" r="${mr * 0.85}" fill="#1b2752" opacity="0.18"/></g>`;
    const sr = S * 0.05, sunY = h * 0.11;
    sky += `<g id="sunGroup" style="opacity:0"><circle cx="${w * 0.62}" cy="${sunY}" r="${sr * 2.3}" fill="url(#sunGlow)"/>
      <circle cx="${w * 0.62}" cy="${sunY}" r="${sr}" fill="#ffd740"/></g>`;
    let clouds = '';
    const puffs = [[0.08, 0.07, 0.11], [0.2, 0.05, 0.08], [0.38, 0.12, 0.12], [0.5, 0.1, 0.07], [0.68, 0.06, 0.12], [0.82, 0.09, 0.09], [0.95, 0.15, 0.1], [0.27, 0.2, 0.09], [0.6, 0.22, 0.1], [0.86, 0.24, 0.08]];
    for (const [cx, cy, rx] of puffs) {
      clouds += `<ellipse cx="${(cx * w).toFixed(1)}" cy="${(cy * h).toFixed(1)}" rx="${(rx * w).toFixed(1)}" ry="${(rx * w * 0.3).toFixed(1)}"/>`;
      clouds += `<ellipse cx="${((cx + rx * 0.45) * w).toFixed(1)}" cy="${(cy * h - rx * w * 0.16).toFixed(1)}" rx="${(rx * w * 0.6).toFixed(1)}" ry="${(rx * w * 0.26).toFixed(1)}"/>`;
    }
    sky += `<g id="cloudGroup" style="opacity:0">${clouds}</g>`;

    // ── Distant hills with rooted trees (Section 4b) ──
    // Each hill is drawn by sampling its ridge function; each tree's base
    // sits a little below the ridge and the hill is drawn AFTER its trees,
    // so the hill covers the bottom of every trunk.
    const ridgePath = ridge => {
      let d = `M 0 ${fgTop + 2} L 0 ${ridge(0).toFixed(1)}`;
      for (let x = 4; x <= w + 4; x += 4) d += ` L ${x} ${ridge(x).toFixed(1)}`;
      return d + ` L ${w} ${fgTop + 2} Z`;
    };
    const treeSvg = tr => {
      const s = tr.size, x = tr.x, b = tr.baseY;
      return `<g opacity="${tr.hill === 'far' ? 0.7 : 0.9}"><rect x="${(x - s * 0.04).toFixed(1)}" y="${(b - s * 0.32).toFixed(1)}" width="${(s * 0.08).toFixed(1)}" height="${(s * 0.32).toFixed(1)}" fill="#3b3530"/>
        <polygon class="farTree" points="${x},${(b - s).toFixed(1)} ${(x - s * 0.24).toFixed(1)},${(b - s * 0.55).toFixed(1)} ${(x + s * 0.24).toFixed(1)},${(b - s * 0.55).toFixed(1)}" fill="#27493f"/>
        <polygon class="farTree" points="${x},${(b - s * 0.8).toFixed(1)} ${(x - s * 0.3).toFixed(1)},${(b - s * 0.26).toFixed(1)} ${(x + s * 0.3).toFixed(1)},${(b - s * 0.26).toFixed(1)}" fill="#27493f"/></g>`;
    };
    const farPath = ridgePath(hillsGeo.ridgeFar), nearPath = ridgePath(hillsGeo.ridgeNear);
    let hills = hillsGeo.trees.filter(t => t.hill === 'far').map(treeSvg).join('');
    hills += `<path id="hillFar" d="${farPath}" fill="#2a3762"/><path class="hillSnow" d="${farPath}" fill="#dfe8ff" opacity="0"/>`;
    hills += hillsGeo.trees.filter(t => t.hill === 'near').map(treeSvg).join('');
    hills += `<path id="hillNear" d="${nearPath}" fill="#243152"/><path class="hillSnow" d="${nearPath}" fill="#e8efff" opacity="0"/>`;

    // ── The grass plane in perspective (Section 1a) ──
    // Rows shrink toward the horizon. Each tuft has one real height (2-8 in)
    // and belongs to that height's layer; a layer fades out over the inch
    // before the snow reaches its height. The ground underneath whitens
    // everywhere as snow builds. Drawn once; only the layers' opacity changes.
    const GRASS_BUCKETS = [2, 3, 4, 5, 6, 8];
    const scaleAt = y => m.pxPerInch * (y - fgTop) / (m.baseY - fgTop); // px per inch at that row
    let fg = `<rect x="0" y="${fgTop}" width="${w}" height="${h - fgTop + 1}" fill="url(#yardG)"/>
      <g id="fieldSnow" opacity="0"><rect x="0" y="${fgTop}" width="${w}" height="${h - fgTop + 1}" fill="#eef3fa"/>
      <rect x="0" y="${fgTop}" width="${w}" height="${h - fgTop + 1}" fill="url(#groundSpeck)"/></g>`;
    const buckets = {};
    GRASS_BUCKETS.forEach(b => { buckets[b] = ''; });
    let tuftCount = 0;
    const GRASS_ROWS = 10;
    for (let k = 0; k < GRASS_ROWS; k++) {
      const f = Math.pow((k + 1) / GRASS_ROWS, 1.6);          // 0 = horizon … 1 = bottom edge
      const ry = fgTop + (h - fgTop) * f;
      const sc = scaleAt(ry);
      const n = Math.round((w / 11) * (0.55 + (1 - f) * 0.9));
      for (let i = 0; i < n; i++) {
        const inches = GRASS_BUCKETS[Math.floor(rng() * GRASS_BUCKETS.length)];
        const x = (i + rng() * 0.9) / n * w, yy = ry + rng() * 4 * f;
        if (x > I.x - 6 && x < I.x + I.w + 6 && yy > I.y) continue; // hidden behind the inset anyway
        const hPx = inches * sc;
        let d = '';
        for (let bl = 0; bl < 3; bl++) {

          const lean = (rng() - 0.5) * hPx * 0.5, hh = hPx * (0.75 + rng() * 0.25);
          d += `M${bx.toFixed(1)} ${yy.toFixed(1)} q${(lean * 0.3).toFixed(1)} ${(-hh * 0.6).toFixed(1)} ${lean.toFixed(1)} ${(-hh).toFixed(1)} `;
        }
        buckets[inches] += `<path d="${d}" stroke-width="${(0.5 + f * 1.3).toFixed(2)}" opacity="${(0.5 + f * 0.5).toFixed(2)}"/>`;
