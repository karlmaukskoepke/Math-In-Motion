        let alpha = f.layer === 'fg' ? 0.95 : 0.7, sx = 1, sy = 1;
        if (f.landedAt) {
          const p = (now - f.landedAt) / LAND_MS;
          if (p >= 1) { flakes.splice(i, 1); continue; }
          sx = 1 + p * 0.9; sy = Math.max(0.15, 1 - p * 0.85); alpha *= 1 - p;
          if (f.inInset) f.y = insetSurface - f.r * sy * 0.5; // ride the inset's snow top as it rises
        } else {
          f.y += f.vy * dt;
          f.x += Math.sin(f.phase + f.y * 0.03) * f.sway * dt;
          if (f.layer === 'bg') {
            if (f.y > fadeBottom) { flakes.splice(i, 1); continue; }
            if (f.y > fadeTop) alpha *= Math.max(0, (fadeBottom - f.y) / (fadeBottom - fadeTop));
          } else {
            const surface = f.inInset ? insetSurface : f.landY;
            if (f.y + f.r >= surface) { f.landedAt = now; f.y = surface - f.r * 0.5; }
          }
        }
        if (alpha <= 0.01) continue;
        fctx.globalAlpha = alpha;
        fctx.beginPath();
        fctx.ellipse(f.x, f.y, f.r * sx, f.r * sy, 0, 0, Math.PI * 2);
        fctx.fill();
        if (scene.bright) fctx.stroke();
      }
      fctx.globalAlpha = 1;
      updateBirds(now, dt);
    }
    requestAnimationFrame(frame);
  }

  // A bird: dark body, rusty breast, flapping wing. Flies in from the side,
  // perches on the feeder for a few seconds, flies off. Never in heavy snow.
  function makeBird() {
    const g = svgEl('g', { class: 'bird' }, el.birdLayer);
    svgEl('ellipse', { cx: 0, cy: 0, rx: 6.5, ry: 4.4, fill: '#3b4054' }, g);
    svgEl('ellipse', { cx: 2.2, cy: 1.4, rx: 3.6, ry: 2.8, fill: '#c5684b' }, g);
    svgEl('circle', { cx: 5.2, cy: -3, r: 3.2, fill: '#3b4054' }, g);
    svgEl('circle', { cx: 6.2, cy: -3.6, r: 0.7, fill: '#ffffff' }, g);
    svgEl('polygon', { points: '8,-3.4 11,-2.6 8,-2', fill: '#e3a63c' }, g);
    svgEl('polygon', { points: '-6,-1 -11,-3 -10,1', fill: '#2c3040' }, g);
    const wing = svgEl('path', { d: 'M -3 -1 Q 1 -9 4 -1 Z', fill: '#2c3040' }, g);
    return { g, wing };
  }
  function updateBirds(now, dt) {
    if (now >= nextBirdAt) {
      nextBirdAt = now + (BIRD_MIN_S + Math.random() * (BIRD_MAX_S - BIRD_MIN_S)) * 1000;
      if (scene.tier < 3 && !birds.length && el.perches) {
        const count = Math.random() < 0.35 ? 2 : 1;
        for (let k = 0; k < count; k++) {
          const perch = el.perches[k];
          const fromRight = Math.random() < 0.5;
          const b = makeBird();
          birds.push(Object.assign(b, {
            phase: 'in', t: 0, dur: 1.4 + k * 0.3,
            from: { x: fromRight ? L.width + 20 : -20, y: L.height * (0.08 + Math.random() * 0.15) },
            to: perch, stay: 3 + Math.random() * 3, dirIn: fromRight ? -1 : 1,
          }));
        }
      }
    }
    for (let i = birds.length - 1; i >= 0; i--) {
      const b = birds[i];
      b.t += dt;
      let x, y, flapping = true, dir;
      if (b.phase === 'in') {
        const p = Math.min(1, b.t / b.dur), e = 1 - Math.pow(1 - p, 2);
        x = b.from.x + (b.to.x - b.from.x) * e;
        y = b.from.y + (b.to.y - b.from.y) * e - Math.sin(p * Math.PI) * L.height * 0.05;
        dir = b.dirIn;
        if (p >= 1) { b.phase = 'perch'; b.t = 0; }
      } else if (b.phase === 'perch') {
        x = b.to.x; y = b.to.y - Math.abs(Math.sin(b.t * 2.2)) * 1.2; flapping = false; dir = b.dirIn;
        if (b.t >= b.stay) { b.phase = 'out'; b.t = 0; b.out = { x: b.dirIn > 0 ? L.width + 30 : -30, y: L.height * 0.05 }; }
      } else {
        const p = Math.min(1, b.t / 1.2), e = p * p;
        x = b.to.x + (b.out.x - b.to.x) * e; y = b.to.y + (b.out.y - b.to.y) * e;
        dir = b.dirIn;
        if (p >= 1) { b.g.remove(); birds.splice(i, 1); continue; }
      }
      const s = el.birdScale;
      b.g.setAttribute('transform', `translate(${x.toFixed(1)},${(y - 4.4 * s).toFixed(1)}) scale(${(dir * s).toFixed(2)},${s.toFixed(2)})`);
      b.wing.setAttribute('transform', flapping ? `scale(1,${Math.sin(performance.now() / 45) > 0 ? 1 : -0.6})` : 'scale(1,0.5)');
    }
  }

  new ResizeObserver(() => buildScene()).observe(sceneWrap);
  if (!prefersReducedMotion) requestAnimationFrame(frame); // no flakes or birds with reduced motion

  // Connects the top of the snow on the stake to the matching point on
  // the graph (current hour, current depth). The stake and the graph use
  // different scales, so the line ends exactly on the plotted point.
  const linkDot = document.getElementById('linkDot');
  const contentEl = document.getElementById('content');
  const invalidateGeom = () => { geom = null; };
  window.addEventListener('resize', invalidateGeom);
  function updateLinkLine(depthInches) {
    if (depthInches == null || mode !== 'explorer' || chartWrap.classList.contains('hidden') || !el.anchor) {
      linkLine.setAttribute('opacity', 0); linkDot.setAttribute('opacity', 0); return;
    }
    // Page positions are measured once and reused until the layout changes
    // (resize, mode switch, story toggle, scene rebuild). Re-measuring every
    // frame forced the browser to lay out the page 60 times a second.
    if (!geom) geom = { svg: sceneSvg.getBoundingClientRect(), chart: document.getElementById('chart').getBoundingClientRect(), box: contentEl.getBoundingClientRect() };
    const x1 = geom.svg.left + +el.anchor.getAttribute('cx') - geom.box.left;
    const y1 = geom.svg.top + +el.anchor.getAttribute('cy') - geom.box.top;
    const x2 = geom.chart.left - geom.box.left + chart.scales.x.getPixelForValue(playbackHour);
    const y2 = geom.chart.top - geom.box.top + chart.scales.y.getPixelForValue(depthInches);
    linkLine.setAttribute('x1', x1); linkLine.setAttribute('y1', y1);
    linkLine.setAttribute('x2', x2); linkLine.setAttribute('y2', y2);
    linkDot.setAttribute('cx', x2); linkDot.setAttribute('cy', y2);
    linkLine.setAttribute('opacity', 0.6); linkDot.setAttribute('opacity', 1);
  }
  function refreshLinkLine() {
    if (mode === 'explorer') updateLinkLine(SM.depthAt(currentExplorerForecast(), playbackHour));
  }
  window.addEventListener('resize', refreshLinkLine);

  // ══════════════════════════════════════════════════════════════
  // TIMELINE SLIDER (Spec v2, 4a). The scene always matches the thumb.
  // Arrow keys move 1 hour (Shift: 1/4 hour), snapping to that grid.
  // ══════════════════════════════════════════════════════════════
  const SLIDER_STEP = 1, SLIDER_FINE_STEP = 0.25;
  const timeline = document.getElementById('timeline');
  const timeSlider = document.getElementById('timeSlider');
  const hourReadout = document.getElementById('hourReadout');
  const hourOf = document.getElementById('hourOf');
  const tlTicks = document.getElementById('tlTicks');
  const tlLock = document.getElementById('tlLock');
  let timelineTotal = 0;
  let playbackHour = 0;

  function formatHour(t) {
    const q = Math.round(t * 4);
    if (Math.abs(t * 4 - q) < 1e-6) {
      const whole = Math.floor(q / 4), frac = ['', '¼', '½', '¾'][q % 4];
      return whole === 0 && frac ? frac : `${whole}${frac}`;
    }
    return t.toFixed(1);
  }
  function setTimeline(total, locked) {
    timelineTotal = total;
    timeSlider.max = total;
    timeSlider.disabled = !!locked;
    timeline.classList.toggle('is-locked', !!locked);
    tlLock.hidden = !locked;
    hourOf.textContent = `of ${total}`;
    const labels = new Set(SM.axisLabels(total));
    tlTicks.innerHTML = '';
    for (let hr = 0; hr <= total; hr++) {
      const t = document.createElement('div');
      t.className = 'tl-tick' + (labels.has(hr) ? ' major' : '');
      t.style.left = (total ? hr / total * 100 : 0) + '%';
      if (labels.has(hr)) { const s = document.createElement('span'); s.textContent = hr; t.appendChild(s); }
      tlTicks.appendChild(t);
    }
    updateSliderUI();
  }
  function updateSliderUI() {
    timeSlider.value = playbackHour;
    timeSlider.style.setProperty('--pct', (timelineTotal ? playbackHour / timelineTotal * 100 : 0) + '%');
    hourReadout.textContent = formatHour(playbackHour);
    timeSlider.setAttribute('aria-valuetext', `Hour ${formatHour(playbackHour)}`);
  }
  // The forecast the slider is scrubbing right now (null = nothing to scrub).
  function activeForecast() {
    if (mode === 'explorer') return currentExplorerForecast();
    return currentMatchItem && matchPhase !== 'pick' ? currentMatchItem.correct : null;
  }
  function seek(t) {
    const f = activeForecast();
    if (!f) return;
    playbackHour = Math.max(0, Math.min(SM.forecastTotalHours(f), t));
    if (mode === 'explorer') drawExplorerGraph(playbackHour);
    const d = setScene(f, playbackHour);
    updateLinkLine(mode === 'explorer' ? d : null);
    updateSliderUI();
    // Match: the verdict arrives when the trace reaches the end.
    if (mode === 'match' && matchPhase === 'reveal' && playbackHour >= SM.forecastTotalHours(f) - 1e-9) showVerdict();
  }
  timeSlider.addEventListener('input', () => { playBtn.classList.remove('pulse'); stopPlayback(); seek(+timeSlider.value); });
  timeSlider.addEventListener('keydown', e => {
    const dir = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1 }[e.key];
    if (!dir) return;
    e.preventDefault();
    const step = e.shiftKey ? SLIDER_FINE_STEP : SLIDER_STEP;
    const target = dir > 0
      ? (Math.floor(playbackHour / step + 1e-6) + 1) * step
      : (Math.ceil(playbackHour / step - 1e-6) - 1) * step;
    playBtn.classList.remove('pulse');
    stopPlayback();
    seek(target);
  });

  const tlHint = document.getElementById('tlHint');
  const HINT_SHOW_MS = 4000;
  let hintTimer = null;
  function showHint() {
    tlHint.classList.add('show');
    clearTimeout(hintTimer);
    hintTimer = setTimeout(() => tlHint.classList.remove('show'), HINT_SHOW_MS);
  }
  timeSlider.addEventListener('mouseenter', showHint);
  timeSlider.addEventListener('focus', showHint);
  timeSlider.addEventListener('pointerdown', showHint);

  // ══════════════════════════════════════════════════════════════
  // EXPLORER — builder state + live graph/story
  // Every choice comes from the model's Explorer rules: only options that
  // fit are listed, and ones that would break a LATER piece are greyed
  // with a reason. Later pieces are never changed behind the student's back.
  // ══════════════════════════════════════════════════════════════
  const startDepthHost = document.getElementById('startDepthHost');
  const segmentRows = document.getElementById('segmentRows');
  const addSegmentBtn = document.getElementById('addSegmentBtn');
  const builderMsg = document.getElementById('builderMsg');
  let explorerStart = 2;
  let explorerSegments = [{ weather: 'snow', rise: 1, run: 3, hours: 6 }]; // friendly default, matches the v1 spec's example
  const WEATHER_LABEL = { snow: 'Snowing', cloudy: 'Cloudy', sun: 'Sunny (melting)' };

  function currentExplorerForecast() {
    return { start: explorerStart, segments: explorerSegments.map(s => Object.assign({}, s)) };
  }
  function afterEdit() {
    builderMsg.textContent = '';
    renderSegmentRows();
    renderExplorerAtRest();
  }

  function renderSegmentRows() {
    const f = currentExplorerForecast();
    startDepthHost.replaceChildren(makePicker({
      label: 'Starting depth',
      options: SM.startOptions(f).map(o => Object.assign({ label: String(o.value) }, o)),
      value: f.start,
      onChange: v => { explorerStart = v; afterEdit(); },
    }));

    segmentRows.innerHTML = '';
    f.segments.forEach((seg, i) => {
      const row = document.createElement('div');
      row.className = 'segment-row';
      row.appendChild(makePicker({
        label: `Piece ${i + 1} weather`,
        options: SM.weatherOptions(f, i).map(o => Object.assign({ label: WEATHER_LABEL[o.value] }, o)),
        value: seg.weather,
        onChange: w => { explorerSegments[i] = SM.bestPiece(f, i, w, seg); afterEdit(); },
      }));
      if (seg.weather !== 'cloudy') {
        row.appendChild(makePicker({
          label: `Piece ${i + 1} rate`,
          options: SM.rateOptions(f, i, seg.weather).map(o => ({ value: `${o.rise},${o.run}`, label: SM.rateLabel(o.rise, o.run, seg.weather), ok: o.ok, reason: o.reason })),
          value: `${seg.rise},${seg.run}`,
          onChange: v => {
            const [r, u] = v.split(',').map(Number);
            explorerSegments[i] = SM.bestPiece(f, i, seg.weather, { rise: r, run: u, hours: seg.hours });
            afterEdit();
          },
        }));
      }
      row.appendChild(makePicker({
        label: `Piece ${i + 1} hours`,
        options: SM.hourOptions(f, i, seg.weather, seg.rise, seg.run).map(o => Object.assign({ label: `${o.value}h` }, o)),
        value: seg.hours,
        onChange: h => { explorerSegments[i] = Object.assign({}, seg, { hours: h }); afterEdit(); },
      }));
      if (f.segments.length > 1) {
        const rc = SM.removeCheck(f, i);
        const rm = document.createElement('button');
        rm.className = 'seg-remove'; rm.type = 'button'; rm.textContent = '✕';
        rm.setAttribute('aria-label', `Remove piece ${i + 1}`);
        if (!rc.ok) { rm.setAttribute('aria-disabled', 'true'); rm.title = rc.reason; }
        rm.onclick = () => {
          if (!rc.ok) { builderMsg.textContent = rc.reason; return; } // tap shows why
          explorerSegments.splice(i, 1); afterEdit();
        };
        row.appendChild(rm);
      }
      segmentRows.appendChild(row);
    });

    const ac = SM.addCheck(f);
    addSegmentBtn.setAttribute('aria-disabled', String(!ac.ok));
    addSegmentBtn.title = ac.ok ? '' : ac.reason;
    addSegmentBtn.onclick = () => {
      if (!ac.ok) { builderMsg.textContent = ac.reason; return; }
      explorerSegments.push(ac.piece); afterEdit();
    };
  }

  const toggleSteps = document.getElementById('toggleSteps');
  const toggleStory = document.getElementById('toggleStory');
  const storyText = document.getElementById('storyText');
  toggleStory.onchange = () => {
    geom = null;
    storyText.classList.toggle('hidden', !toggleStory.checked);
    storyText.textContent = SM.forecastStory(currentExplorerForecast());
  };
  toggleSteps.onchange = () => drawExplorerGraph(playbackHour);

  function stepPoints(forecast, uptoHour) {
    // Rise/run staircase for whatever has been drawn up to `uptoHour`. The
    // unit step (run, rise) REPEATS across each piece (a 6-hour "1 inch
    // every 3 hours" piece draws two 3h/1in steps).
    const runPts = [], risePts = [], labels = [];
    let t = 0, d = forecast.start;
    for (const seg of forecast.segments) {
      if (seg.weather === 'cloudy' || t >= uptoHour) { t += seg.hours; d += SM.segmentDelta(seg); continue; }
      const reps = seg.hours / seg.run;
      let segT = t, segD = d;
      for (let r = 0; r < reps && segT < uptoHour; r++) {
        const runEnd = Math.min(segT + seg.run, uptoHour);
        runPts.push({ x: segT, y: segD }, { x: runEnd, y: segD }, { x: NaN, y: NaN });
        if (runEnd >= segT + seg.run) {
          const newD = segD + seg.rise;
          risePts.push({ x: runEnd, y: segD }, { x: runEnd, y: newD }, { x: NaN, y: NaN });
          labels.push({ kind: 'run', x0: segT, x1: runEnd, y: segD, melting: seg.rise < 0, firstOfSeg: r === 0,
            text: seg.run === 1 ? '1 hour' : `${seg.run} hours` });
          labels.push({ kind: 'rise', x: runEnd, y0: segD, y1: newD, firstOfSeg: r === 0,
            text: `${seg.rise < 0 ? '−' : '+'}${Math.abs(seg.rise)} ${Math.abs(seg.rise) === 1 ? 'inch' : 'inches'}` });
          segD = newD;
        }
        segT += seg.run;
      }
      t += seg.hours; d += SM.segmentDelta(seg);
    }
    return { runPts, risePts, labels };
  }

  // The graph is drawn up to `uptoHour` (the slider), from depthAt.
  function drawExplorerGraph(uptoHour) {
    const forecast = currentExplorerForecast();
    const drawn = [{ x: 0, y: SM.depthAt(forecast, 0) }];
    let t = 0;
    for (const seg of forecast.segments) {
      t += seg.hours;
      if (t >= uptoHour) break;
      drawn.push({ x: t, y: SM.depthAt(forecast, t) });
    }
    if (uptoHour > 0) drawn.push({ x: uptoHour, y: SM.depthAt(forecast, uptoHour) });
    chart.data.datasets[0].data = drawn;
    chart.data.datasets[3].data = uptoHour > 0 ? drawn : [];
    if (toggleSteps.checked) {
      const { runPts, risePts, labels } = stepPoints(forecast, uptoHour);
      chart.data.datasets[1].data = runPts;
      chart.data.datasets[2].data = risePts;
      stepLabels = labels;
    } else {
      chart.data.datasets[1].data = [];
      chart.data.datasets[2].data = [];
      stepLabels = [];
    }
    chart.update('none');
    return drawn[drawn.length - 1].y;
  }

  function renderExplorerAtRest() {
    stopPlayback();
    playbackHour = 0;
    const forecast = currentExplorerForecast();
    setTimeline(SM.forecastTotalHours(forecast), false);
    seek(0);
    if (toggleStory.checked) storyText.textContent = SM.forecastStory(forecast);
  }

  // ══════════════════════════════════════════════════════════════
  // PLAYBACK — shared by Explorer and Match's post-pick reveal. Runs on
  // animation frames, so the snow top rises smoothly; Play resumes from
  // the thumb, Replay starts at hour 0.
  // ══════════════════════════════════════════════════════════════
  const SPEED_SEC_PER_HOUR = { slow: 2, normal: 1, fast: 0.35 };
  const speedSelect = document.getElementById('speedSelect');
  const playBtn = document.getElementById('playBtn');
  const replayBtn = document.getElementById('replayBtn');
  let playRaf = null;
  let onPlaybackDone = null;

  function stopPlayback() {
    if (playRaf) { cancelAnimationFrame(playRaf); playRaf = null; }
    playBtn.textContent = '▶ Play';
  }
  function startPlayback(onDone) {
    stopPlayback();
    const f = activeForecast();
    if (!f) return;
    onPlaybackDone = onDone || null;
    const total = SM.forecastTotalHours(f);
    if (playbackHour >= total - 1e-9) playbackHour = 0;
    let last = performance.now(), skipFrame = false;
    playBtn.textContent = '⏸ Pause';
    const tick = now => {
      const secPerHour = SPEED_SEC_PER_HOUR[speedSelect.value] || 1;
      playbackHour = Math.min(total, playbackHour + Math.max(0, now - last) / 1000 / secPerHour);
      last = now;
      // Performance level 2+: redraw the graph and scene every other frame
      // (30 Hz). Time still advances every frame, so speed is unchanged.
      skipFrame = perfLevel >= 2 && !skipFrame && playbackHour < total;
      if (skipFrame) { playRaf = requestAnimationFrame(tick); return; }
      seek(playbackHour);
      if (playbackHour >= total) { stopPlayback(); if (onPlaybackDone) onPlaybackDone(); return; }
      playRaf = requestAnimationFrame(tick);
    };
    playRaf = requestAnimationFrame(tick);
  }
  playBtn.onclick = () => { playBtn.classList.remove('pulse'); if (playRaf) stopPlayback(); else startPlayback(); };
  replayBtn.onclick = () => { stopPlayback(); playbackHour = 0; seek(0); startPlayback(); };

  // ══════════════════════════════════════════════════════════════
  // MATCH THE FORECAST
  // ══════════════════════════════════════════════════════════════
  const matchStoryEl = document.getElementById('storyText'); // the banner above the scene
  const matchBox = document.getElementById('matchBox');
  const matchChoicesEl = document.getElementById('matchChoices');
  const matchFeedbackEl = document.getElementById('matchFeedback');
  const nextItemBtn = document.getElementById('nextItemBtn');
  let currentMatchItem = null;

  // Small choice graph: MAX_HOURS x MAX_DEPTH units, every unit MG.U wide
  // AND tall (unit squares). Margins hold the tick numbers.
  const MG = { U: 16, L: 30, R: 8, T: 9, B: 24 };
  const MG_W = MG.L + SM.MAX_HOURS * MG.U + MG.R, MG_H = MG.T + SM.MAX_DEPTH * MG.U + MG.B;
  function miniGraphSvg(points) {
    const sx = x => MG.L + x * MG.U;
    const sy = y => MG.T + (SM.MAX_DEPTH - y) * MG.U;
    const xl = new Set(SM.axisLabels(SM.MAX_HOURS)), yl = new Set(SM.axisLabels(SM.MAX_DEPTH));
    let grid = '';
    for (let v = 0; v <= SM.MAX_HOURS; v++) {
      grid += `<line x1="${sx(v)}" y1="${sy(0)}" x2="${sx(v)}" y2="${sy(SM.MAX_DEPTH)}" stroke="var(--muted)" stroke-width="0.7" opacity="${xl.has(v) ? 0.55 : 0.24}"/>`;
      if (xl.has(v)) grid += `<text x="${sx(v)}" y="${sy(0) + 17}" text-anchor="middle" font-family="Space Mono" font-size="12" fill="var(--muted)">${v}</text>`;
    }
    for (let v = 0; v <= SM.MAX_DEPTH; v++) {
      grid += `<line x1="${sx(0)}" y1="${sy(v)}" x2="${sx(SM.MAX_HOURS)}" y2="${sy(v)}" stroke="var(--muted)" stroke-width="0.7" opacity="${yl.has(v) ? 0.55 : 0.24}"/>`;
      if (yl.has(v)) grid += `<text x="${MG.L - 6}" y="${sy(v) + 4.5}" text-anchor="end" font-family="Space Mono" font-size="12" fill="var(--muted)">${v}</text>`;
    }
    const path = points.map((p, i) => (i ? 'L' : 'M') + sx(p.t) + ',' + sy(p.d)).join(' ');
    return `<svg viewBox="0 0 ${MG_W} ${MG_H}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${grid}
      <path d="${path}" fill="none" stroke="var(--text)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
  }

  // Lay out the four choices as 2x2 or 1x4 — whichever gives the bigger
  // grid cells in the space available (?tile= forces one).
  const CHOICE_CHROME = 16; // 6px padding + 2px border, each side
  function layoutMatchChoices() {
    const box = matchBox.getBoundingClientRect();
    if (!box.width || !box.height) return;
    const gap = 12;
    const fits = [{ cols: 2, rows: 2, name: '2x2' }, { cols: 4, rows: 1, name: '1x4' }].map(c => {
      const cw = (box.width - gap * (c.cols - 1)) / c.cols, ch = (box.height - gap * (c.rows - 1)) / c.rows;
      const s = Math.min((cw - CHOICE_CHROME) / MG_W, (ch - CHOICE_CHROME) / MG_H);
      return Object.assign(c, { s, cellPx: s * MG.U });
    });
    const forced = fits.find(c => c.name === URLP.tile);
    const pick = forced || (fits[0].s >= fits[1].s ? fits[0] : fits[1]);
    matchChoicesEl.style.gridTemplateColumns = `repeat(${pick.cols}, ${(MG_W * pick.s + CHOICE_CHROME).toFixed(1)}px)`;
    matchChoicesEl.style.gridTemplateRows = `repeat(${pick.rows}, ${(MG_H * pick.s + CHOICE_CHROME).toFixed(1)}px)`;
    matchChoicesEl.dataset.layout = pick.name;
    matchChoicesEl.dataset.cellPx = pick.cellPx.toFixed(1);
    matchChoicesEl.dataset.cellPx2x2 = fits[0].cellPx.toFixed(1);
    matchChoicesEl.dataset.cellPx1x4 = fits[1].cellPx.toFixed(1);
  }
  new ResizeObserver(layoutMatchChoices).observe(matchBox);

  function setPlaybackEnabled(on) { playBtn.disabled = !on; replayBtn.disabled = !on; }

  // ── Match round state (Phase 1A.2, Section 2) ──
  //   'pick'    — choose a graph; nothing about the true forecast shows.
  //   'reveal'  — the pick is locked in (and scored), the chosen graph sits
  //               on the scene, and the student plays/drags to test it.
  //   'verdict' — right/wrong, the mistake line, score chips update, Next.
  let matchPhase = 'pick';
  let pickResult = null;   // recordAttempt() result, shown at the verdict
  let pickedIndex = null;
  let seedPending = URLP.seed != null;
  const showResultBtn = document.getElementById('showResultBtn');
  const OVERLAY_SLIDE_MS = 400;

  function newMatchItem() {
    stopPlayback();
    playBtn.classList.remove('pulse');
    setPlaybackEnabled(false);
    matchFeedbackEl.classList.add('hidden');
    matchFeedbackEl.classList.remove('is-right', 'is-wrong');
    nextItemBtn.classList.add('hidden');
    showResultBtn.classList.add('hidden');
    matchPhase = 'pick';
    pickResult = null; pickedIndex = null;
    scene.overlay = null;

    let item = null, roundSeed = 0;
    // ?seed=N makes the FIRST round reproducible; "Next" is random after that.
    const seed = seedPending ? URLP.seed : null;
    seedPending = false;
    for (let tries = 0; tries < 40 && !item; tries++) {
      roundSeed = (seed != null ? seed * 101 + tries : (Date.now() ^ (Math.random() * 1e9) ^ tries)) >>> 0;
      const rng = SM.makeRng(roundSeed);
      const forecast = SM.generateForecast(rng, { numSegments: currentLevel() });
      const key = SM.pointsKey(SM.forecastPoints(forecast));
      if (seed == null && SM.wasLastItem(key)) continue;
      item = SM.buildMatchItem(rng, forecast, 3);
      if (item) SM.rememberLastItem(key);
    }
    if (!item) { matchStoryEl.textContent = 'Could not build a round — try again.'; return; }
    currentMatchItem = item;
    matchStoryEl.textContent = item.story;
    // Day or night, tied to the round's seed (?scene= forces it).
    scene.type = URLP.scene || SM.sceneTypeFor(roundSeed);
    // Leak rule: before a pick the scene shows the story's true starting
    // depth at hour 0 with no weather, and the slider is locked.
    playbackHour = 0;
    setScene(item.correct, 0, { neutral: true });
    setTimeline(SM.forecastTotalHours(item.correct), true);
    matchChoicesEl.innerHTML = '';
    item.choices.forEach((choice, i) => {
      const div = document.createElement('div');
      div.className = 'match-choice';
      div.tabIndex = 0;
      div.setAttribute('role', 'button');
      div.setAttribute('aria-label', `Graph ${i + 1}`);
      div.innerHTML = miniGraphSvg(choice.points);
      div.onclick = () => pickMatchChoice(i, div);
      div.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pickMatchChoice(i, div); } };
      matchChoicesEl.appendChild(div);
    });
    layoutMatchChoices();
  }

  function pickMatchChoice(i, card) {
    if (matchPhase !== 'pick') return;
    const choice = currentMatchItem.choices[i];
    // The pick locks in and is scored now (first try, one score per
    // round), but the score chips only change at the verdict.
    pickResult = SM.recordAttempt(choice.isCorrect);
    pickedIndex = i;
    matchPhase = 'reveal';
    Array.from(matchChoicesEl.children).forEach((c, j) => {
      c.classList.add(j === i ? 'your-pick' : 'dimmed');
      c.classList.add('resolved');
      c.tabIndex = -1;
    });
    // The chosen graph goes onto the scene; no autoplay.
    scene.overlay = { chosen: choice, truth: currentMatchItem.correct, split: SM.firstSplit(currentMatchItem.correct, choice.forecast), revealAll: false };
    slideCardToScene(card);
    setPlaybackEnabled(true);
    setTimeline(SM.forecastTotalHours(currentMatchItem.correct), false);
    playbackHour = 0;
    seek(0);
    matchFeedbackEl.classList.remove('hidden');
    matchFeedbackEl.textContent = 'Play the story or drag the slider to test your pick.';
    showResultBtn.classList.remove('hidden');
    // Point at Play until the student plays or moves the slider; the reveal
    // runs at Fast by default (the control still works).
    speedSelect.value = 'fast';
    playBtn.classList.add('pulse');
  }

  // A copy of the chosen card glides from the grid to where the overlay
  // sits on the scene, then fades as the overlay takes its place.
  function slideCardToScene(card) {
    if (!L || !el.ov) return;
    if (prefersReducedMotion) return;
    const from = card.getBoundingClientRect();
    const svgRect = sceneSvg.getBoundingClientRect();
    const I = L.inset;
    const to = { left: svgRect.left + I.x, top: svgRect.top + I.y, width: I.w, height: I.h };
    const ghost = card.cloneNode(true);
    ghost.classList.add('match-ghost');
    Object.assign(ghost.style, { left: from.left + 'px', top: from.top + 'px', width: from.width + 'px', height: from.height + 'px' });
    document.body.appendChild(ghost);
    el.ov.style.opacity = '0';
    const anim = ghost.animate([
      { transform: 'translate(0,0) scale(1,1)', opacity: 1 },
      { transform: `translate(${to.left - from.left}px, ${to.top - from.top}px) scale(${to.width / from.width}, ${to.height / from.height})`, opacity: 0.15 },
    ], { duration: OVERLAY_SLIDE_MS, easing: 'cubic-bezier(.3,.7,.3,1)', fill: 'forwards' });
    anim.onfinish = () => { ghost.remove(); el.ov.style.transition = 'opacity 150ms'; el.ov.style.opacity = '1'; };
  }

  // The verdict: when the trace reaches the end, or on "Show result".
  function showVerdict() {
    if (matchPhase !== 'reveal') return;
    playBtn.classList.remove('pulse');
    matchPhase = 'verdict';
    const choice = currentMatchItem.choices[pickedIndex];
    const card = matchChoicesEl.children[pickedIndex];
    card.classList.remove('your-pick');
    card.classList.add(choice.isCorrect ? 'correct-pick' : 'wrong-pick');
    if (!choice.isCorrect) {
      const right = currentMatchItem.choices.findIndex(c => c.isCorrect);
      matchChoicesEl.children[right].classList.remove('dimmed');
      matchChoicesEl.children[right].classList.add('correct-pick', 'answer-was');
    }
    scene.overlay.revealAll = true;
    applyScene();
    refreshScoreDisplay();
    matchFeedbackEl.classList.add(choice.isCorrect ? 'is-right' : 'is-wrong');
    let msg = choice.isCorrect ? 'Right! The snow followed your graph all the way.' : (SM.RULE_FEEDBACK[choice.rule] || 'Not quite.');
    const sp = scene.overlay.split;
    if (!choice.isCorrect && sp) {
      const truth = currentMatchItem.correct;
      const differAt = Math.abs(SM.depthAt(truth, sp.hour) - SM.depthAt(choice.forecast, sp.hour)) > 1e-9;
      msg += differAt ? ` Your graph is already off at hour ${sp.hour}.` : ` Your graph leaves the snow's path right after hour ${sp.hour}.`;
    }
    const r = pickResult;
    if (r && r.earnedNewMedal) msg += ` New medal: ${MEDAL_EMOJI[r.newMedal]}`;
    if (r && r.leveledUp) msg += ` Level up! Next forecasts have ${currentLevel()} pieces.`;
    else if (r && choice.isCorrect && currentLevel() < SM.MAX_LEVEL) {
      msg += ` ${SM.LEVEL_UP_STREAK - SM.getScoreState().levelProgress} more in a row for Level ${currentLevel() + 1}.`;
    }
    matchFeedbackEl.textContent = msg;
    showResultBtn.classList.add('hidden');
    nextItemBtn.classList.remove('hidden');
  }
  showResultBtn.onclick = showVerdict;
  nextItemBtn.onclick = newMatchItem;

  // ── init ──
  applyTheme(getTheme());
  if (URLP.start != null || URLP.segs) {
    const candidate = {
      start: URLP.start != null ? URLP.start : explorerStart,
      segments: URLP.segs ? URLP.segs.slice(0, SM.MAX_SEGMENTS) : explorerSegments,
    };
    const problem = SM.checkForecast(candidate);
    if (!problem) { explorerStart = candidate.start; explorerSegments = candidate.segments; }
    else console.warn('Snow Challenge: ignoring an Explorer forecast in the URL that breaks the limits —', problem);
  }
  if (URLP.steps) toggleSteps.checked = true;
  if (URLP.story) toggleStory.checked = true;
  buildScene();
  renderSegmentRows();
  setMode(URLP.mode === 'match' ? 'match' : 'explorer');
  if (mode === 'explorer' && URLP.at) {
    const total = SM.forecastTotalHours(currentExplorerForecast());
    seek(URLP.at === 'end' ? total : Math.max(0, Math.min(total, +URLP.at || 0)));
  }
  // Deep link into a Match reveal (for review): ?pick=…&reveal=…
  if (mode === 'match' && URLP.pick && currentMatchItem) {
    const ch = currentMatchItem.choices;
    let idx = /^[0-3]$/.test(URLP.pick) ? +URLP.pick : -1;
    if (URLP.pick === 'right') idx = ch.findIndex(c => c.isCorrect);
    if (URLP.pick === 'wrong') {
      // the wrong graph that stays on the snow's path longest, so the split shows mid-trace
      idx = ch.map((c, i) => i).filter(i => !ch[i].isCorrect)
        .map(i => ({ i, at: (SM.firstSplit(currentMatchItem.correct, ch[i].forecast) || { hour: 0 }).hour }))
        .sort((a, b) => b.at - a.at)[0].i;
    }
    if (idx >= 0) {
      pickMatchChoice(idx, matchChoicesEl.children[idx]);
      const total = SM.forecastTotalHours(currentMatchItem.correct);
      const sp = scene.overlay && scene.overlay.split;
      if (URLP.reveal === 'mid') seek(sp ? Math.min(total - 0.25, sp.hour + 1) : total / 2);
      else if (URLP.reveal === 'end') seek(total);
    }
  }
  requestAnimationFrame(refreshLinkLine);
})();
</script>
